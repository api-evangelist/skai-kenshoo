note: >-
  Skai publishes list prices openly — unusual for enterprise ad-tech. Tiers are gated on
  ANNUAL ADVERTISING SPEND MANAGED THROUGH THE PLATFORM, not on API calls, seats or data
  volume. There is no developer/API-specific plan, no free tier and no self-serve signup;
  every tier routes to "Get Started" / "Book a Demo". API and MCP access is included with the
  platform subscription rather than sold separately, and Skai states every tier unlocks the
  GenAI platform including Celeste AI.
