name: Skai (Kenshoo)
description: >-
  Skai (formerly Kenshoo) is an AI-powered commerce media platform that helps brands and
  agencies centralize retail media, paid search, and paid social data, then plan, activate,
  optimize, and measure omnichannel marketing campaigns across Amazon, Google, Meta, retailers,
  and marketplaces. The Skai/Kenshoo platform exposes a partner API (api.kenshoo.com) with a
  developer hub for programmatic campaign management, reporting, and data integration. Products
  include Celeste AI (a GenAI commerce-media agent), the Skai Data Hub, Retail Media, Search &
  Social, Omnichannel Planning, and Digital Shelf Optimization.
