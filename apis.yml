- name: Skai MCP Servers
  description: >-
    First-party hosted, remote Model Context Protocol servers exposing the Skai platform to AI
    assistants. The Reporting MCP is read-only and publishes five tools — fetch_report,
    relevant_columns, get_today, get_change_log and get_competitive_context — two of which
    (get_change_log, get_competitive_context) have no REST equivalent. The Operations MCP
    carries write access for bid, budget and status changes at scale, with preview and approval
    before anything is applied. Authentication is OAuth 2.0 against login.kenshoo.com
    (authorization_code + PKCE S256, RFC 8414 and RFC 9728 discovery published) or a 90-day
    personal access token sent with a ks-name header. Documented clients include Claude Code,
    Claude Desktop, Claude Web, ChatGPT, Cursor, VS Code, Windsurf and Google Gemini.
  humanURL: https://skai-mcp-guide.vercel.app/
  baseURL: https://mcp.kenshoo.com
  tags:
  - MCP
  - Agent Native
  - Reporting
  - Campaign Management
