name: Skai (Kenshoo)
description: >-
  Skai (formerly Kenshoo) is an AI-powered commerce media platform that helps brands and
  agencies centralize retail media, paid search, and paid social data, then plan, activate,
  optimize, and measure omnichannel marketing campaigns across Amazon, Google, Microsoft,
  Meta, Walmart, Instacart, Kroger, Target and 120+ other publishers and marketplaces. Skai
  publishes a real, anonymously readable OpenAPI 3.0.0 contract — 117 paths, 158 operations,
  155 schemas — served through a Redoc developer hub at developers.skai.io and callable at
  services.kenshoo.com, covering reporting (synchronous and asynchronous), bulk entity
  management, campaigns, ad groups, ads, portfolios, product groups, custom columns,
  incrementality testing and budget pacing. Alongside the REST API, Skai runs first-party
  hosted MCP servers at mcp.kenshoo.com — a read-only Reporting MCP and a write-access
  Operations MCP for bid, budget and status changes with preview and approval — authenticated
  with OAuth 2.0 or a 90-day personal access token. Products include Celeste AI (a GenAI
  commerce-media agent), the Skai Data Hub, Retail Media, Search & Social, Omnichannel
  Planning, and Digital Shelf Optimization.
