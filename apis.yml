apis:
- name: Skai (Kenshoo) API
  description: >-
    Skai's REST API for programmatic access to advertising data and campaign management across
    search, social and retail-media publishers. Reporting is the primary surface — synchronous
    for small pulls, asynchronous analysis reports for anything larger — alongside Bulk Update
    (one file, millions of rows, hundreds of attributes) for scaled changes, typed CRUD for
    campaigns/ad groups/ads/portfolios/product groups, a separate /api/v2 branch for Meta
    entities, custom columns, incrementality data sources and budget pacing. Authentication is
    a bearer JWT obtained by exchanging a permanent refresh token; requests are scoped by a
    `ks` account identifier. Rate limited to 60 requests/minute and 2,000/hour per user.
  humanURL: https://developers.skai.io/
  baseURL: https://services.kenshoo.com
  tags:
