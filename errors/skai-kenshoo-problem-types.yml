status_codes:
- code: 400
  title: Bad Request
  meaning: Validation failure on client input.
  declared_on_operations: 69
  typed_schema: true
  named_responses: [BadRequest, GetCampaignBadRequest, GetPortfolioBadRequest, getAdBadRequest,
