format: proprietary
rfc9457: false
rfc9457_note: >-
  Skai does not use application/problem+json. Errors are returned as application/json in
  Skai's own `ApiResponse` envelope. There is no `type` URI, no `title`, no `detail` and no
  `instance` field, so a generic RFC 9457 client cannot interpret a Skai failure.
envelope:
