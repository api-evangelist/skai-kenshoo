  remediation: >-
    Read entities[].errors[] for the offending field and error token; correct and resend.
- code: 401
  title: Unauthorized
  meaning: >-
    Authentication failed — most often an expired access token. Skai names 401 as one of the
    two supported ways to detect token expiry (the other is tracking `expires_in`).
  declared_on_operations: 11
  typed_schema: false
  remediation: >-
    Re-exchange the permanent refresh token at POST /api/v1/token (operationId getAccessToken)
    for a new access token and retry. Cache the new token for its full `expires_in` — minting
    tokens too often trips the rate limit.
