  schema: ApiResponse
  shape:
    status:
      type: string
      enum: [SUCCESS, FAILED, PARTIAL_SUCCESS]
      description: Overall outcome of the request.
    entities:
      type: array
      description: One entry per entity the request touched.
      items:
        id:
          type: integer
          format: int64
          description: Entity ID, or null when the failure occurred before an entity existed.
        success:
          type: boolean
        errors:
          type: array
          description: Zero or more ErrorField objects for this entity.
  error_field_schema:
    declared:
      fieldName: {type: string, description: The error field}
      error: {type: string, description: Error message}
      parameters: {type: object, additionalProperties: string, description: Error additional properties}
    observed_in_examples:
      field_name: string
      error: string
      parameters: object
    defect: >-
      The ErrorField SCHEMA names the property `fieldName` while every published error EXAMPLE
      emits `field_name`. A client typed off the schema will not find the field on the wire.
      Reported as a spec defect, not resolved here.
  example_failed: |
    {
      "status": "FAILED",
      "entities": [
        {
          "id": null,
          "success": false,
          "errors": [
            { "field_name": "name", "error": "ILLEGAL_NAME" }
