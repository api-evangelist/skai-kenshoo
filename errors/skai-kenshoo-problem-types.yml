  title: Internal Server Error
  meaning: Unexpected server-side failure.
  declared_on_operations: 111
  typed_schema: true
  named_responses: [InternalServerError]
  example_error_token: 'field_name "ServerError", error "Unexpected error occurred."'
  remediation: Retry with backoff. NOTE - the API publishes no idempotency mechanism, so a
    blind retry of a write is not safe (see conventions/skai-kenshoo-conventions.yml).
- code: 422
  title: Unprocessable Entity
  meaning: Validation failure for client input, reported as free-text strings rather than
