supersedes: >-
  The 2026-07-21 pass recorded versioning as "unknown" because the developer hub was read as a
  gated single-page app. It is a Redoc shell; the real OpenAPI is anonymously readable at
  https://api-gateway-documentation-production.s3.amazonaws.com/api-gateway/docs and versioning
  is now derived from it.
versioning:
  scheme: uri-path
  pattern: /api/v{n}/...
  current: v1
  versions_in_use: [v1, v2]
  spec_version: 1.0.0
  note: >-
    v1 carries the bulk of the surface. v2 exists for Meta (Facebook/Instagram) campaigns, ad
    groups and ads and for a second generation of the incrementality data-source endpoints.
    No policy explains how v1 and v2 relate, whether v1 equivalents will be retired, or how a
    new version is announced. There is no version header and no media-type versioning.
  policy_url: null
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    No deprecation or sunset policy is published, and neither the Sunset nor the Deprecation
    response header appears anywhere in the contract. Integrators get no machine-readable
    warning that an operation is going away.
  deprecated_operations:
  - operationId: runAsyncReport
    path: POST /api/v1/reports/async
    signal: summary text only
    summary: Configure and run a Fusion/Structure report (deprecated)
    replacement: asyncAnalysisReport (POST /api/v1/reports/async/analysis)
    replacement_note: >-
      Skai marks the analysis endpoint "(recommended)" in its own summary.
    defect: >-
      The word "deprecated" is in the SUMMARY STRING; the OpenAPI `deprecated: true` flag is
      NOT set on this or any other operation. Zero of 158 operations carry the flag, so no
      tool, linter or generated client will surface the deprecation.
