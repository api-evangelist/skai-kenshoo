maturity:
  api_age: >-
    Kenshoo has shipped a partner API for well over a decade; third-party connectors
    (Improvado, Celigo) reference a "Kenshoo V3 API" generation predating the current
    /api/v1 surface.
  rebrand: >-
    Kenshoo rebranded to Skai in 2021. Both developers.skai.io and developers.kenshoo.com
    serve the same documentation and the API host remains services.kenshoo.com, so the legacy
    domain is load-bearing, not a redirect.
