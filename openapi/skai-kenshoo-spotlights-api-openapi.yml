      - Spotlights
      summary: Describe api spotlights ai conversation message by message id
      x-summary-source: derived
      operationId: optionsApiV1SpotlightsAiConversationMessageByMessageId
      x-operation-id-source: derived
  /api/v1/spotlights/ai/conversation:
    post:
      summary: request conversation
      operationId: createSpotlightAiConversation
      responses:
        200:
          description: 200 response
        400:
          description: 400 response
        500:
          description: 500 response
      tags:
      - Spotlights
    options:
      description: For cross-origin requests
      responses:
        default:
          description: The operation was completed successfully
      tags:
      - Spotlights
      summary: Describe api spotlights ai conversation
      x-summary-source: derived
      operationId: optionsApiV1SpotlightsAiConversation
      x-operation-id-source: derived
