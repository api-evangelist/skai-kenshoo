paths:
  /api/v1/bulk_update:
    post:
      tags:
      - Bulk Update
      summary: Make bulk changes to multiple entities
      description: "Upload a CSV bulksheet to create and update campaigns, ad groups, keywords, ads, and more — across dozens of publishers — in a single API call.\n\n#### Unmatched publisher breadth\n\nNo other platform offers programmatic create and edit operations across this many publishers in one API. Skai's Bulk Update covers:\n\n| Category | Publishers |\n|---|---|\n| Search | Google Ads, Microsoft Ads, Yahoo Japan, Baidu, and others |\n| Retail Media | Amazon (SP/SB/SD), Walmart (SP/SB/SV), Instacart, Criteo, DoorDash, Sam's Club, Bol, Topsort, Moloco, Koddi, and 100+ others |\n| Social | Pinterest, Snapchat, TikTok, Apple Search Ads |\n| Social (Meta, LinkedIn, Reddit) | Dimension assignment and basic status edits |\n\n**Supported operations by entity type:**\n\n| Entity | Create | Edit |\n|---|---|---|\n| Campaign | Yes | Yes |\n| Ad Group | Yes | Yes |\n| Keyword | Yes | Yes |\n| Ad | Yes | Yes |\n| Product Group | — | Yes (dimension assignment) |\n| Target | — | Yes (dimension assignment) |\n| Search Term | — | Yes (dimension assignment) |\n\nThe file format is identical to what Skai users export and import manually in the platform — every attribute visible in the Skai UI is editable through this API.\n\n---\n\n#### The bulksheet format\n\nBulksheets are UTF-8 CSV files. Each row is one entity. **Use `bulk_update_type=MULTI_ENTITY_FILE` (recommended)** — it allows any mix of entity types in a single file using an `Entity Type` column as the first column:\n\n```\nEntity Type,Profile ID,Campaign ID,Ad Group ID,Campaign Name,Ad Group Name,Keyword,Keyword Match Type,Keyword Bid,Status\nCampaign,55,,,,,,,,Active\nAd group,55,1001,,,Brand Ad Group,,,, Active\nKeyword,55,1001,5001,,,running shoes,exact,0.50,Active\n```\n\nIf you need single-entity files, set `bulk_update_type` to the specific entity (e.g. `CAMPAIGN`) and omit the `Entity Type` column — though everything supported in single-entity mode is also supported in `MULTI_ENTITY_FILE`.\n\n---\n\n#### Editing entities\n\nTo edit, each row needs only three things:\n1. **Entity Type** — `Campaign`, `Ad group`, `Ad`, or `Keyword`\n2. **The entity's Skai ID** — `Campaign ID`, `Ad Group ID`, `Ad ID`, or `Keyword ID`\n3. **Only the columns you want to change** — all other columns can be omitted\n\n> **Skai IDs vs publisher IDs:** Bulksheets use Skai's internal IDs, not publisher IDs. Retrieve them via the [Reporting API](#operation/fetchReport) — e.g. request the `CampaignId` field on the CAMPAIGN entity.\n\n**Minimal edit example — update budgets for 3 campaigns:**\n```\nEntity Type,Campaign ID,Campaign Daily Budget\nCampaign,1001,150\nCampaign,1002,200\nCampaign,1003,75\n```\n\n---\n\n#### Creating entities\n\nTwo methods are supported. Use **IDs** when you have them (faster); use **hierarchy names** when you don't.\n\n**ID method** — provide the parent entity's Skai ID. This example creates two keywords in an existing ad group (ID 55123):\n```\nEntity Type,Ad Group ID,Keyword,Keyword Match Type,Keyword Bid\nKeyword,55123,running shoes,exact,0.50\nKeyword,55123,buy running shoes,broad,0.40\n```\n\n**Hierarchy method** — provide the name path instead of IDs. This example creates one keyword by identifying its ad group through the Channel Account ID (mandatory), Profile Name, Campaign Name, and Ad Group Name:\n```\nEntity Type,Channel Account ID,Profile Name,Campaign Name,Ad Group Name,Keyword,Keyword Match Type,Keyword Bid\nKeyword,673,Skai Sports - US - Google,Brand Campaign,Brand Ad Group,running shoes,exact,0.50\n```\n\n**Minimum required columns for creation:**\n\n| Entity | ID method | Hierarchy method |\n|---|---|---|\n| Campaign | Channel Account ID + Profile ID + Campaign Name | Channel Account ID + Profile Name + Campaign Name |\n| Ad Group | Campaign ID + Ad Group Name | + Campaign Name + Ad Group Name |\n| Ad | Ad Group ID + Ad Type | + Campaign Name + Ad Group Name + Ad Type |\n| Keyword | Ad Group ID + Keyword + Keyword Match Type | + Campaign Name + Ad Group Name + Keyword + Keyword Match Type |\n\n**Publisher-specific notes:**\n- **Status values differ by publisher type:** `Active` / `Paused` (Apple Search Ads); `Approve` / `Pause` (Retail Media); `Approved` / `Pause` (Search & most Social)\n- **Retail Media creates** require `Campaign Tracking Level = None`\n- Some publishers have additional required fields (e.g. Amazon Sponsored Brands requires `Brand entity ID` or `Brand entity name`; Pinterest and Snapchat require `Campaign Start Date`). Start from an export when working with a new publisher.\n\n---\n\n#### Best practices\n\n**Start from an export.** The fastest way to get the correct column format for a publisher or campaign type is to export existing entities from the Skai UI. The export is identical in format to the import — edit the values you need and re-import. This is especially valuable the first time you work with a new publisher or campaign type.\n\n**Work with the media team first.** When building programmatic bulksheets, get a working example verified in the Skai UI with the media team, then implement the code to generate it at scale.\n\n**Use minimal columns for edits.** You only need the entity ID and the columns you're changing. Omitting unrelated columns reduces errors and makes the file easier to debug.\n\n**Use the error file — it's readable.** When rows fail, retrieve the error file (see below) — you get all failed rows in the original format with a plain-text error description appended as the last column. Errors are specific and actionable. An AI coding agent can read this file, parse the failures, fix the rows, and resubmit without manual intervention.\n\n---\n\n#### Retrieving results\n\nAfter submitting, use the returned `job_id` to poll status and retrieve results.\n\n**1. Poll for completion** — [GET /api/v1/jobs/{job_id}/status](#tag/Jobs/paths/~1api~1v1~1jobs~1{job_id}~1status/get)\nPoll until status is `JOB_COMPLETED` or `JOB_COMPLETED_WITH_FAILURES`.\n\n**2. Get the summary** — [GET /api/v1/jobs/{job_id}/results/file](#tag/Jobs/paths/~1api~1v1~1jobs~1{job_id}~1results~1file/get) with `info_level=SUMMARY`\nReturns a JSON summary:\n```json\n{\n  \"elementType\": \"MULTI_ENTITY_FILE\",\n  \"processed\": 25,\n  \"updated\": 23,\n  \"failed\": 2\n}\n```\n\n**3. Get failed rows** — same endpoint with `info_level=BREAKDOWN`\nReturns a zipped CSV with all failed rows in the original import format, plus an error description in the last column."
      operationId: bulkUpdate
      parameters:
      - $ref: '#/components/parameters/ks'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: CSV, XLSX, TXT, or TSV — uncompressed or zip-compressed. Maximum size 50 MB.
                  format: binary
                file_delimiter:
                  type: string
                  description: Column delimiter used in the file. Use `COMMA` for standard CSV.
                  enum:
                  - COMMA
                  - TAB
                  - SEMICOLON
                bulk_update_type:
                  type: string
                  description: The entity type of the uploaded file. Use `MULTI_ENTITY_FILE` (recommended) to mix entity types in one file using an `Entity Type` column. Use a specific entity type for single-entity files.
                  enum:
                  - MULTI_ENTITY_FILE
                  - CAMPAIGN
                  - AD_GROUP
                  - KEYWORD
                  - AD
                  - PRODUCT_GROUP
                  - PORTFOLIO
                  - SITELINK
                  - AUDIENCES
                  - PROFILE_STATUS
                  - PROFILE_F2A
                  - PROFILE_ONBOARDING
        required: true
      responses:
        200:
          description: Job created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    description: Use this ID to poll job status and retrieve results.
              example:
                job_id: c42f1168-4cd6-42e8-b654-2a7f0043699e
        400:
          $ref: '#/components/responses/BadRequest'
        500:
          $ref: '#/components/responses/InternalServerError'
      x-code-samples:
      - lang: cURL
        source: "curl -X POST \\\n  'https://services.kenshoo.com/api/v1/bulk_update?ks=<YOUR_KS_ID>' \\\n  -H 'Authorization: Bearer <YOUR_TOKEN>' \\\n  -F 'file=@changes.csv' \\\n  -F 'file_delimiter=COMMA' \\\n  -F 'bulk_update_type=MULTI_ENTITY_FILE'\n\n# Response: {\"job_id\": \"c42f1168-4cd6-42e8-b654-2a7f0043699e\"}\n# Then poll: GET /api/v1/jobs/{job_id}/status\n"
components:
  schemas:
    EntityResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        success:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorField'
    ErrorField:
      type: object
      properties:
        fieldName:
          type: string
          description: The error field
        error:
          type: string
          description: Error message
        parameters:
          type: object
          additionalProperties:
            type: string
          description: Error additional properties
    ApiResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ApiResponseStatus'
        entities:
          type: array
          items:
            $ref: '#/components/schemas/EntityResponse'
    ApiResponseStatus:
      type: string
      readOnly: true
      enum:
      - SUCCESS
      - FAILED
      - PARTIAL_SUCCESS
  responses:
    BadRequest:
      description: Bad request (usually indicates validation failure for client input)
      content:
        application/json:
          schema:
            $ref: '#/components/responses/ApiResponse'
          example:
            status: FAILED
            entities:
            - id: null
              success: false
              errors:
              - field_name: name
                error: ILLEGAL_NAME
    InternalServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/responses/ApiResponse'
          example:
            status: FAILED
            entities:
            - id: null
              success: false
              errors:
              - field_name: ServerError
                error: Unexpected error occurred.
                parameters: {}
    ApiResponse:
      $ref: '#/components/schemas/ApiResponse'
  parameters:
    ks:
      name: ks
      in: query
      description: The KS to refer the request to. You can find this ID in the Skai platform under _Administration_ -> _About Skai_ -> _Server ID_
      required: true
      style: form
      explode: true
      schema:
        type: string
      example: '1234'
