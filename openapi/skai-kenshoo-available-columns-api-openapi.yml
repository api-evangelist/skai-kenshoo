        | `CTR` | CTR | PERCENT | The click-through rate, expressed as the number of clicks on the ad divided by the times it was shown. |

        | `Clicks` | Clicks | INTEGER | The number of clicks reported by the publisher. |

        | `Conversion` | Conv. | FLOAT | An aggregation of all conversion actions coming from publishers, Skai pixel, and 3rd-party integration, or from actions you select. |

        | `ConversionRate` | Conv. Rate | PERCENT | The conversion rate, expressed as the number of conversions divided by the number of clicks. |

        | `Cost` | Cost | MONETARY | The publisher cost, in the currency of the Skai profile. |

        | `CostConversion` | Cost/Conv. | MONETARY | The cost of each conversion, expressed as cost divided by the number of conversions. |

        | `Impressions` | Imp. | INTEGER | The number of impressions reported by the publisher. |

        | `Profit` | Profit | MONETARY | Profit = revenue - cost |

        | `ROI` | ROI | FLOAT | Return on investment. The formula is: ROI = revenue / cost |

        | `Revenue` | Rev. | MONETARY | An aggregation of all monetary value of conversion actions, coming from publishers, Skai''s pixel, and 3rd-party integration. |

        | `RevConversion` | Rev./Conv. | MONETARY | The revenue amount divided by the number of conversions. |


        **Attributes** (18 columns)


        | Column name | Display name | Type | Description |

        |---|---|---|---|

        | `Additional images` | Additional images | STRING | Links to up to 20 additional images of your item, separated by a comma (,), semicolon (;), space ( ) or vertical bar (|). |

        | `Additional images (cdn)` | Additional images (CDN) | STRING | Additional image URLs of the product, hosted on CDN. |

        | `Brand` | Brand | STRING | The brand of the product. |

        | `Buy box winner (legacy)` | Buy box winner (legacy) | BOOLEAN | Indicates if you are the Buy Box winner for a given product |

        | `Color` | Color | STRING | The color of the product listing linked to the ad. |

        | `Inventory` | Inventory | INTEGER | The current availability of the item. |

        | `Manufacturer` | Manufacturer | STRING | The brand that manufactures the advertised product. |

        | `Marketplace` | Marketplace | STRING | A geographical marketplace where products are sold. |

        | `Material` | Material | STRING | The material the item is made from, such as cotton, polyester, denim or leather. |

        | `Model` | Model | STRING | The model of the product. |

        | `# Of Ads` | Number of ads | INTEGER | The number of ads promoting this product |

        | `Availability` | Number of sellers | INTEGER | The number of sellers selling this product. |

        | `Price` | Price | MONETARY | The price of the product. |

        | `Product images` | Product images | STRING | The URL for the main image of your product. |

        | `Publisher` | Publisher | STRING | The name of the publisher serving the ads. |

        | `Shipped by` | Shipped by | STRING | Indicates the vendor or seller shipping this product. |

        | `Sold by` | Sold by | STRING | Indicates the vendor or seller selling this product |

        | `Title` | Title | STRING | The name of the product promoted in the campaign. |


        **Account-configured columns** *(vary by account — call this endpoint authenticated to see yours)*


        | Column name | Display name | Type | Description |

        |---|---|---|---|

        | `[Your Dimension Name]` | *(your label)* | STRING | A custom tagging label you define in Skai (e.g. "Brand", "Region", "Campaign Theme"). Applied to entities; any value you''ve set appears here. |

        | `[Publisher / Pixel / 3rd-party Conversion]` | *(event name)* | FLOAT | Each tracked conversion event appears as two columns: a **count** column (number of conversions) and a **revenue** column (monetary value). Names are set in Settings → Conversions. |

        | `[Your Custom Metric]` | *(formula name)* | FLOAT | A formula-based column your team defines (e.g. ROAS = Revenue / Cost). Available in the *Custom Metrics+* and *Custom Metrics (legacy)* groups. |


        **Product Identifiers** (8 columns)


        | Column name | Display name | Type | Description |

        |---|---|---|---|

        | `Base & variants` | Base & variants | STRING | Base & variants |

        | `Ean` | EAN | STRING | European Article Number. |

        | `GTIN` | GTIN | STRING | Global Trade Item Number. |

        | `Mpn` | MPN | STRING | Manufacturer Part Number. |

        | `Parent Product ID` | Parent Product ID | STRING | The product ID of the parent product, if one exists. |

        | `Parent Product` | Parent product | STRING | The product ID of the parent product, if one exists. |

        | `Product Id` | Product ID | STRING | The unique identifier of the product in the publisher. |

        | `Upc` | UPC | STRING | The Amazon UPC code. |

        ##### PRODUCT_TARGETING


        *Product targeting entities — keywords, ASINs, categories, and product attributes used in retail media targeting.*


        > **Note:** Column names for PRODUCT_TARGETING use display-name style (e.g. `Avg.CPC`, `Conv.`) rather than camelCase. Use these exact strings in your API requests.


        **Performance** (12 standard columns)


        | Column name | Display name | Type | Description |

        |---|---|---|---|

        | `Avg.CPC` | Avg. CPC | MONETARY | The average cost per click expressed as the number of clicks divided by cost. |

        | `CTR` | CTR | PERCENT | The click-through rate, expressed as the number of clicks on the ad divided by the times it was shown. |

        | `Clicks` | Clicks | INTEGER | The number of clicks reported by the publisher. |

        | `Conv.` | Conv. | FLOAT | An aggregation of all conversion actions coming from publishers, Skai pixel, and 3rd-party integration, or from actions you select. |

        | `Conv. Rate` | Conv. Rate | PERCENT | The conversion rate, expressed as the number of conversions divided by the number of clicks. |

        | `Cost` | Cost | MONETARY | The publisher cost, in the currency of the Skai profile. |

        | `Cost/Conv.` | Cost/Conv. | MONETARY | The cost of each conversion, expressed as cost divided by the number of conversions. |

        | `Imp.` | Imp. | INTEGER | The number of impressions reported by the publisher. |

        | `Profit` | Profit | MONETARY | Profit = revenue - cost |

        | `ROI` | ROI | FLOAT | Return on investment. The formula is: ROI = revenue / cost |

        | `Rev` | Rev. | MONETARY | An aggregation of all monetary value of conversion actions, coming from publishers, Skai''s pixel, and 3rd-party integration. |

        | `Rev./Conv.` | Rev./Conv. | MONETARY | The revenue amount divided by the number of conversions. |


        **Attributes** (30 columns)


        | Column name | Display name | Type | Description |

        |---|---|---|---|

        | `Ad Group Name` | Ad Group Name | STRING | The name of the ad group. |

        | `AdGroupId` | Ad Group ID | INTEGER | The ad group ID in Skai. |

        | `AdGroupStatusToDisplay` | Ad Group Status | STRING | The status of the ad group. |

        | `Bid` | Bid | MONETARY | The entity bid amount in the currency defined for the Skai profile. |

        | `Brand` | Brand | STRING | The brand of the product. |

        | `Campaign ID` | Campaign ID | INTEGER | The campaign ID in Skai. |

        | `Campaign Name` | Campaign Name | STRING | The campaign name in Skai. |

        | `CampaignStatusToDisplay` | Campaign Status | STRING | The status of the campaign. |

        | `CampaignType` | Campaign Goal | STRING | The type of campaign. |

        | `Category id` | Category id | STRING | Category id |

        | `Channel` | Publisher | STRING | The name of the publisher serving the ads. |

        | `Channel Target ID` | Channel Target ID | STRING | The target ID in the publisher. |

        | `FailureReason` | Failure Reason | STRING | The latest error recorded upon a failed attempt to sync entity changes to the publisher. |

        | `Max. Price` | Max. Price | MONETARY | Maximum price filter for product targeting. |

        | `Max. Rating` | Max. Rating | FLOAT | Maximum customer rating filter for product targeting. |

        | `Min. Price` | Min. Price | MONETARY | Minimum price filter for product targeting. |

        | `Min. Rating` | Min. Rating | FLOAT | Minimum customer rating filter for product targeting. |

        | `Modified` | Modified | BOOLEAN | Indicates an edited entity. |

        | `Product Pages Bid Adj.` | Product Pages Bid Adj. | FLOAT | A percentage increase or decrease in the bid for this placement. |

        | `Profile Id` | Profile ID | INTEGER | The Skai profile ID. |

        | `Profile Name` | Profile Name | STRING | The Skai profile name. |

        | `ProfileStatus` | Profile Status | STRING | The Skai profile status. |

        | `Rest of Search Bid Adj.` | Rest of Search Bid Adj. | FLOAT | A percentage increase or decrease in the bid for placements outside top of search. |

        | `Shipping Eligibility` | Shipping Eligibility | STRING | Shipping eligibility status for the targeted product. |

        | `Target` | Target | STRING | The targeting expression (keyword, ASIN, category, or product attribute). |

        | `Target ID` | Target ID | INTEGER | The targeting ID in Skai. |

        | `Target Type` | Target Type | STRING | The type of targeting (e.g. keyword, ASIN, category, product attribute). |

        | `Targeting Status` | Targeting Status | STRING | The status of the targeting entity. |

        | `Title` | Title | STRING | The name of the product promoted in the campaign. |

        | `Top of Search Bid Adj.` | Top of Search Bid Adj. | FLOAT | A percentage increase or decrease in the bid for top-of-search placement. |


        **Account-configured columns** *(vary by account — call this endpoint authenticated to see yours)*


        | Column name | Display name | Type | Description |

        |---|---|---|---|

        | `[Your Dimension Name]` | *(your label)* | STRING | A custom tagging label you define in Skai (e.g. "Brand", "Region", "Campaign Theme"). Applied to entities; any value you''ve set appears here. |

        | `[Publisher / Pixel / 3rd-party Conversion]` | *(event name)* | FLOAT | Each tracked conversion event appears as two columns: a **count** column (number of conversions) and a **revenue** column (monetary value). Names are set in Settings → Conversions. |

        | `[Your Custom Metric]` | *(formula name)* | FLOAT | A formula-based column your team defines (e.g. ROAS = Revenue / Cost). Available in the *Custom Metrics+* and *Custom Metrics (legacy)* groups. |



