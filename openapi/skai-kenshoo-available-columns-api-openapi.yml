paths:
  /api/v1/reports/{entity}/available_columns:
    get:
      tags:
      - Available Columns
      summary: Get available columns
      description: 'Get available columns for all Analysis Grid reports. Relevant to [synchronous reports](#operation/fetchReport) and [asynchronous analysis grid reports](#operation/asyncAnalysisReport)


        #### Cross-Profile vs Single-Profile

        Some columns groups in Skai available across all profiles, including in views where no specific profile is requested (Cross-Profile). Others column groups are defined within a profile (even when many profiles have identical definitions), and can only be pulled in single-profile requests (Single-Profile).


        #### report_supported field:

        Shows whether the column is supported for reporting. `true` → Supported and can be included in reports. `false` → Not supported for reporting.


        #### Understanding the returned column groups:

        | Column Group in the API         | Availability                      | Group Name in Skai Column Selection UI  | Description                                                                                                                         |

        |---------------------------------|-----------------------------------|-----------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------|

        | Attributes                      | Cross-Profile and Single-Profile  | Attributes                              | Attributes of your campaigns, native to Skai                                                                                        |

        | Performance                     | Cross-Profile and Single-Profile  | Performance                             | Performance metrics native to Skai                                                                                                  |

        | AttributionForecasting          | Cross-Profile and Single-Profile  | Attribution Forecasting                 | Skai''s forecasted metrics                                                                                                           |

        | CustomMetricsPlus               | Cross-Profile and Single-Profile  | Custom metrics+                         | Organization level formula based columns, defined by users in your organization. Editable under _Dimensions & Categories_           |

        | Dimensions                      | Cross-Profile and Single-Profile  | Dimensions                              | Organization level labeling column, defined by users in your organization. Editable under _Settings_ -> _Custom metrics & columns_  |

        | SmartTags                       | Cross-Profile and Single-Profile  | Smart tags                              | Skai AI-powered insights                                                                                                            |

        | ChannelCustomerConversionTypes  | Cross-Profile and Single-Profile  | Publisher report conversions            | Conversions and revenue from publisher APIs. Names editable under _Settings_ -> _Conversions_                                       |

        | ExternalCustomerConversionTypes | Cross-Profile and Single-Profile  | External report conversion              | Conversions and revenue from Files and Integrations. Names editable under _Settings_ -> _Conversions_                               |

        | ProxyCustomerConversionTypes    | Cross-Profile and Single-Profile  | Skai pixel conversion                   | Conversions and revenue from Skai''s Pixel. Names editable under _Settings_ -> _Conversions_                                         |

        | Custom Solutions                | Cross-Profile and Single-Profile  | Custom Solutions                        | Columns powered by Skai Labs'' custom solutions                                                                                      |

        | ConversionTypes                 | Single-Profile                    | Conversion Columns                      | Conversion Columns set up per profile, often publisher specific. Editable under _Settings_ -> _Conversion columns_ within a profile |

        | CustomMetrics                   | Single-Profile                    | Custom metrics (legacy)                 | Legacy formula based columns, defined by users in your organization. Editable under _Profile settings_ -> _Custom Metrics (legacy)_ |


        <div style="background:#e3f2fd;border-left:4px solid #1976d2;padding:12px 16px;margin:12px 0;border-radius:0 4px 4px 0;">

        <strong>This is a partial list of commonly used columns.</strong> Skai supports hundreds of additional account-configured columns:

        <strong>Dimensions</strong> — custom tagging labels you define and apply to campaigns, ad groups, and keywords;

        <strong>Conversion events</strong> — tracked by publishers, Skai pixel, and 3rd-party integrations, each appearing as a count and a revenue column;

        <strong>Custom Metrics</strong> — formula-based calculations your team creates (e.g. ROAS, CPA targets);

        and more.


        Call this endpoint authenticated to see your <strong>full account-specific column set</strong>.

        </div>


        #### Column Reference


        > **Column name** is what to put in your API request. **Display name** is what users see in the Skai UI.


        > **Types at a glance:** `STRING` = text · `INTEGER`/`FLOAT`/`BIG_INTEGER` = number · `MONETARY`/`NULLABLE_MONETARY` = currency (profile currency) · `PERCENT` = percentage · `BOOLEAN_DISPLAY` = Yes/No · `DATE`/`SERVER_DATE` = date or datetime · `INTEGER_ID` = numeric identifier · Other types are Skai-specific display formats (value is string or number depending on context).



        ##### CAMPAIGN


        **Performance** (21 standard columns)


        | Column name | Display name | Type | Description |

        |---|---|---|---|

        | `AverageCPC` | Avg. CPC | MONETARY | The average cost per click expressed as the number of clicks divided by cost. |

        | `AveragePosition` | Avg. Pos. | FLOAT | Avg. Pos. |

        | `CPM` | CPM | MONETARY | CPM |

        | `CTR` | CTR | PERCENT | The click-through rate, expressed as the number of clicks on the ad divided by the times it was shown. |

        | `Clicks` | Clicks | INTEGER | The number of clicks reported by the publisher. |

        | `Conversion` | Conv. | FLOAT | An aggregation of all conversion actions coming from publishers, Skai pixel, and 3rd-party integration, or from actions you select. |

        | `ConversionRate` | Conv. Rate | PERCENT | The conversion rate, expressed as the number of conversions divided by the number of clicks. |

        | `Cost` | Cost | MONETARY | The publisher cost, in the currency of the Skai profile. |

        | `CostConversion` | Cost/Conv. | MONETARY | The cost of each conversion, expressed as cost divided by the number of conversions. |

        | `Engagement` | Engagement | INTEGER | The number of user engagements with your ads. |

        | `Impressions` | Imp. | INTEGER | The number of impressions reported by the publisher. |

        | `ImprAbsTop` | Impr. (Abs.Top) % | PERCENT | The percentage of ad impressions that are shown as the very first ad above the organic search results |

        | `ImprTop` | Impr. (Top) % | PERCENT | The percentage of ad impressions that are shown anywhere above the organic search results. |

        | `ImpressionShare` | Impression Share (IS) | PERCENT | The percentage of ad impressions you''ve received divided by the estimated number of impressions you were eligible to receive. |

        | `LostImpressionShareBudget` | Lost IS (Budget) | PERCENT | The percentage of impressions lost due to budget constraints. |

        | `LostImpressionShareRank` | Lost IS (Rank) | PERCENT | The percentage of Impressions lost due to rank constraints. |

        | `PostImpression` | Post Imps. Conv. | FLOAT | The number of impressions of your ads that led to a conversion. |

        | `Profit` | Profit | MONETARY | Profit = revenue - cost |

        | `ROI` | ROI | FLOAT | Return on investment. The formula is: ROI = revenue / cost |

        | `Revenue` | Rev. | MONETARY | An aggregation of all monetary value of conversion actions, coming from publishers, Skai''s pixel, and 3rd-party integration. |

        | `RevConversion` | Rev./Conv. | MONETARY | The revenue amount divided by the number of conversions. |


        **Attributes** (61 columns)


        | Column name | Display name | Type | Description |

        |---|---|---|---|

        | `AI Max` | AI Max | STRING | Shows whether AI Max is enabled for this Google Search campaign. |

        | `AccountName` | Account Name | STRING | Name of the account, if available, or the username configured in Skai to access the account |

        | `BidStrategyAdLocation` | Bid Strategy Ad Location | STRING | The customer locations for which you set bid strategy rules to set targets. |

        | `BidStrategyMaxCPC` | Bid Strategy Max. CPC | MONETARY | The bid set to express the highest amount you are willing to pay for an ad click. |

        | `BidStrategyTarget` | Bid Strategy Target | STRING | The value for your publisher-optimized campaigns. |

        | `Brand entity ID` | Brand entity ID | STRING | The brand ID that the campaign is associated with. Required for sellers creating Sponsored Brands campaigns when the brand entity name is empty. |

        | `Brand entity name` | Brand entity name | STRING | The brand name that the campaign is associated with. Required for sellers creating Sponsored Brands campaigns when the brand entity ID is empty. |

        | `BudgetType` | Budget Type | STRING | Budget Type for this campaign |

        | `BidStrategy` | Campaign Bid Strategy | STRING | The bid strategy for the campaign. |

        | `Campaign End Date` | Campaign End Date | DATE | The date the campaign is scheduled to stop running. |

        | `CampaignType` | Campaign Goal | STRING | The type of campaign. |

        | `CampaignId` | Campaign ID | INTEGER | The campaign ID in Skai. |

        | `CampaignName` | Campaign Name | STRING | The campaign name in Skai. |

        | `CampaignOrderLine` | Campaign Order Line | STRING | The ID of the order line used in the Pinterest campaign. |

        | `Campaign Priority` | Campaign Priority | STRING | The campaign selected to serve ads for the product when there are multiple campaigns that advertise the same product.  |

        | `Campaign Start Date` | Campaign Start Date | DATE | The date the campaign is scheduled to start running. |

        | `StatusToDisplay` | Campaign Status | STRING | The status of the campaign. |

        | `AdvertisingChannelSubType` | Campaign subtype | STRING | A specific classification or category within a broader campaign type. |

        | `channelCategory` | Channel | STRING | A publisher attribute such as the campaign ID or ad ID. |

        | `ChannelAccountId` | Channel Account ID | INTEGER | The publisher account ID in Skai. |

        | `channelStatus` | Channel Account Status | STRING | The status of the publisher account. |

        | `ChannelAccountUserName` | Channel Account Username | STRING | The username associated with the publisher account. |

        | `CampaignIdInChannel` | Channel Campaign ID | STRING | The campaign ID in the publisher. |

        | `SaleCountry` | Country of Sale | STRING | The App Store geographical locations where you’re promoting your app. |

        | `CreateDate` | Creation Date | DATETIME | The date and time at which the Skai entity was created. |

        | `DailyBudget` | Daily Budget | MONETARY | The daily budget for the campaign. |

        | `DailySpendCap` | Daily Spend Cap | MONETARY | The daily spend cap of the campaign.  |

        | `campaignDayParting` | Dayparting | STRING | Indicates whether dayparting has been scheduled for the campaign, and whether it is managed manually or automated by AI. |

        | `DeliveryMethod` | Delivery Method | STRING | Indicates how the budget is paced. |

        | `DesktopBidAdjustment` | Desktop Bid Adj. | FLOAT | A percentage increase or decrease in the bid for this placement. |

        | `Disapproval Reason` | Disapproval Reason | STRING | Why the publisher disapproved the ad. |

        | `DisplayUrl` | Display URL | STRING | The display URL of the ad. |

        | `FailureReason` | Failure Reason | STRING | The latest error recorded upon a failed attempt to sync entity changes to the publisher. |

        | `Homepage Bid Adj.` | Homepage Bid Adj. | FLOAT | A percentage increase in the bid for this placement. |

        | `LandUrl` | Landing URL | STRING | The destination URL (for non-upgraded ads) or final URL (for upgraded ads). |

        | `LifetimeSpendCap` | Lifetime Spend Cap | MONETARY | The campaign''s lifetime spend cap amount. |

        | `LocalInventoryAds` | Local Inventory Ads | BOOLEAN | Indicates if your Shopping campaign has local inventory ads. |

        | `MerchantId` | Merchant ID | INTEGER | A unique identification number attached to a business that tells the payment processing systems involved in a transaction where to send which funds. |

        | `MobileBidAdjustment` | Mobile Bid Adj. | FLOAT | A percentage increase or decrease in the bid for this placement. |

        | `Monthly Budget` | Monthly Budget | MONETARY | The monthly budget limit. |

        | `Optimization strategies` | Optimization strategies | STRING | The type of bid changes the publisher is allowed to perform dynamically in order to optimize performance. |

        | `UploadFlag` | Pending Upload | BOOLEAN | Indicates whether the campaign contains entity changes that need to be uploaded to the publisher. |

        | `Placements` | Placements | STRING | The location on the website where an ad can be displayed. |

        | `PortfolioId` | Portfolio ID | INTEGER | The ID of the Skai portfolio. |

        | `PortfolioName` | Portfolio Name | STRING | The name of the Skai portfolio. |

        | `ProfileId` | Profile ID | INTEGER | The Skai profile ID. |

        | `ProfileName` | Profile Name | STRING | The Skai profile name. |

        | `ProfileStatus` | Profile Status | STRING | The Skai profile status. |

        | `Channel` | Publisher | STRING | The name of the publisher serving the ads. |

        | `AutoTaggingEnabled` | Publisher Auto-Tagging Enabled | BOOLEAN | Indicates whether the campaign has auto-tagging enabled in the publisher. |

        | `Recommended daily budget` | Recommended daily budget | MONETARY | **Amazon:** Budget recommended by Amazon to minimize your campaign''s chances of running out of budget and missing out on impressions, clicks, and sales. **Walmart:** The latest daily budget recommendation to minimize the possibility of going out of budget. |

        | `ScheduleFlag` | Scheduled | BOOLEAN | Indicates whether dayparting or a future start date have been scheduled for the campaign. |

        | `Search in Grid Bid Adj.` | Search In-Grid Bid Adj. | FLOAT | A percentage increase or decrease in the bid for this placement. |

        | `ShoppingCampaign` | Shopping Campaign | BOOLEAN | Indicates whether the campaign is a Shopping campaign. |

        | `Stock Up Bid Adj.` | Stock Up Bid Adj. | FLOAT | A percentage increase or decrease in the bid for this placement. |

        | `StructureOptimization` | Structure Optimization | STRING | For Shopping campaigns, an indication whether Skai structure optimization is enabled. |

        | `TabletBidAdjustment` | Tablet Bid Adj. | FLOAT | The tablet bid adjustment for the ad group. |

        | `Top of Search Bid Adj.` | Top of Search Bid Adj. | FLOAT | A percentage increase or decrease in the bid for this placement. |

        | `TrackingLevel` | Tracking Level | STRING | The entity tracking level for the campaign. |

        | `TrackingTemplate` | Tracking Template | STRING | Information added to the base URL for tracking purposes. Applicable for upgraded URLs. |

        | `Weekly Budget` | Weekly Budget | MONETARY | The weekly ad spend limit. |


