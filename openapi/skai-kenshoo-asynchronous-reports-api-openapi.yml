he currency of the profile<br>Example: `1.50`                                                                                                                     |\n| `Ad_ID`                 | Tracking Raw Data - Click Tracking Data                                                                                   | BIGINT       | Tracking ID of the ad in Skai<br>Example: `1123`                                                                                                                                              |\n| `Ad ID KS Unique`       | Tracking Raw Data - Flat P2C                                                                                              | BIGINT       | Ad ID in Skai<br>Example: `2124`                                                                                                                                                              |\n| `Ad_ID_In_Target`       | Tracking Raw Data - Flat P2C                                                                                              | BIGINT       | Ad ID in the publisher<br>Example: `121270991`                                                                                                                                                   |\n| `Ad_Tracking_ID`        | Tracking Raw Data - Flat P2C                                                                                              | BIGINT       | Tracking ID of the ad in Skai<br>Example: `1123`                                                                                                                                              |\n| `Ad_Headline`           | Tracking Raw Data - Click Tracking Data<br>Tracking Raw Data - Flat P2C                                                   | TEXT(255)    | Headline of the ad<br>Example: `Chicago Cars 2016`                                                                                                                                               |\n| `Product Group ID`      | Tracking Raw Data - Flat P2C                                                                                              | BIGINT       | ID of the product group<br>Example: `1234`                                                                                                                                                       |\n| `Conv_ID`               | Tracking Raw Data - Flat P2C                                                                                              | BIGINT       | Unique identifier for a conversion. Can be used to connect clicks and other conversions from a single path, to the conversion at the end of the path.<br>Example: `12345`                        |\n| `Event_Type`            | Tracking Raw Data - Flat P2C                                                                                              | TEXT(100)    | Type of tracking event<br>Example: `Click`                                                                                                                                                       |\n| `Order_ID`              | Tracking Raw Data - Flat P2C                                                                                              | TEXT(3000)   | Order ID of the conversoin, if sent<br>Example: `2384hr83y487ty354`                                                                                                                              |\n| `Promo_Code`            | Tracking Raw Data - Flat P2C                                                                                              | TEXT(3000)   | Promo code sent with the conversion. Used as a free text field.<br>Example: `fff--0212-shopping-cart`                                                                                            |\n| `Assigned_Weight`       | Tracking Raw Data - Flat P2C                                                                                              | FLOAT(20,8)  | The relative weight (out of 1) given to a click