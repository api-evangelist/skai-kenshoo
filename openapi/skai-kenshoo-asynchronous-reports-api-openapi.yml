 Raw Data - Click Tracking Data<br>Tracking Raw Data - Flat P2C                                                   | TEXT(100)    | State (by IP) of the tracking event<br>Example: `NY`                                                                                                                                             |\n| `IP`                    | Tracking Raw Data - Click Tracking Data<br>Tracking Raw Data - Flat P2C                                                   | TEXT(100)    | IP address of the user who clicked the ad, with the last octet redacted to 00<br>Example: `207.242.48.00 `                                                                                       |\n| `Browser`               | Tracking Raw Data - Click Tracking Data<br>Tracking Raw Data - Flat P2C                                                   | TEXT(100)    | Browser used by the user who clicked the ad<br>Example: `Chrome 11`                                                                                                                              |\n| `Language`              | Tracking Raw Data - Click Tracking Data<br>Tracking Raw Data - Flat P2C                                                   | TEXT(100)    | Browser language used by the user who clicked the ad<br>Example: `Spanish `                                                                                                                      |\n| `Revenue`               | Tracking Raw Data - Keywords Daily Performance<br>Tracking Raw Data - Flat P2C                                            | FLOAT(40,20) | Total revenue, in the currency of the profile. Contains revenue from all “aggregated to conv total” conversion columns.<br>Example: `23.34`                                                      |\n| `Cost`                  | Tracking Raw Data - Keywords Daily Performance<br>Tracking Raw Data - Flat P2C                                            | FLOAT(40,20) | Publisher cost, in the currency of the profile<br>Example: `13.12`                                                                                                                               |\n| `Device`                | Tracking Raw Data - Click Tracking Data                                                                                   | TEXT(100)    | Device used by the user who clicked the ad<br>Example: `iPhone 11`                                                                                                                               |\n| `Status`                | Tracking Raw Data - Keywords Daily Performance                                                                            | TEXT(50)     | Status of the keyword<br>Valid values: `Active`, `Paused`, `Deleted`, `Pending`, `Inactive`, `Disapproved`, `Approved`, `Failed`, `To Pause`, `To Delete`, `Failed to Pause`, `Failed to Delete` |\n| `Quality_Score`         | Tracking Raw Data - Keywords Daily Performance                                                                            | INT          | Quality score of the keyword<br>Example: `3`                                                                                                                                                     |\n| `Impressions`           | Tracking Raw Data - Keywords Daily Performance                                                                            | FLOAT(20,8)  | Impressions reported by the publisher<br>Example: `14,519`                                                                                                                                       |\n| `Clicks`                | Tracking Raw Data - Keywords Daily Performance                                                                            | FLOAT(20,8)  | Clicks reported by the publisher<br>Example: `14`                                                                                                                                                |\n| `Avg_Position`          | Tracking Raw Data - Keywords Daily Performance                                                                            | FLOAT(40,20) | Average position of the impression<br>Example: `2.1`                                                                                                                                             |\n| `Avg_CPC`               | Tracking Raw Data - Keywords Daily Performance                                                                            | FLOAT(40,20) | Average cost per click<br>Example: `0.64227`                                                                                                                                                     |\n| `Conversions`           | Tracking Raw Data - Keywords Daily Performance                                                                            | FLOAT(40,20) | Conversion total. Contains all “aggregated to conv total” conversion columns.<br>Example: `1200`                                                                                                 |\n| `CTR`                   | Tracking Raw Data - Keywords Daily Performance                                                                            | FLOAT(40,20) | Click-through rate<br>Example: `0.125`                                                                                                                                                           |\n| `Conv_Rate`             | Tracking Raw Data - Keywords Daily Performance                                                                            | FLOAT(40,20) | Average number of conversions per click<br>Example: `0.4`                                                                                                                                        |\n| `Cost_per_Conv`         | Tracking Raw Data - Keywords Daily Performance                                                                            | FLOAT(40,20) | Cost per conversion<br>Example: `1.54`                                                                                                                                                           |\n| `Rev_per_Conv`          | Tracking Raw Data - Keywords Daily Performance                                                                            | FLOAT(40,20) | Revenue per conversion<br>Example: `52.51`                                                                                                                                                       |\n| `ROI`                   | Tracking Raw Data - Keywords Daily Performance                                                                            | FLOAT(40,20) | Return on investment<br>Example: `11.25`                                                                                                                                                         |\n| `Profit`                | Tracking Raw Data - Keywords Daily Performance                                                                            | FLOAT(40,20) | Revenue minus cost<br>Example: `27511`                                                                                                                                                           |\n"
