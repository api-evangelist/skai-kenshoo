icks reported by the publisher for all other campaigns<br>Example: `23`                                                                               |\n| `CTR`                             | Fusion: Profiles<br>Fusion: Campaigns<br>Fusion: Channels<br>Fusion: Campaigns by Device<br>Fusion: Adgroups<br>Fusion: Ads<br>Fusion: Keywords<br>Fusion: Keywords by Device<br>Fusion: Keywords with Content and PLA<br>Fusion: Dynamic Ad Targets<br>Fusion: Product Groups<br>Fusion: Sitelinks<br>Fusion: Audiences<br>Fusion: Audiences by Device                           | FLOAT(40,20) | Click-through rate<br>Example: `0.125`                                                                                                                                                                                  |\n| `CTR Others`                      | Fusion: Sitelinks                                                                                                                                                                                                                                                                                                                                                                 | FLOAT(40,20) | When sitelinks are shared with multiple campaigns, displays the click-through rate reported by the publisher for all other campaigns<br>Example: `23`                                                                   |\n| `Conversions`                     | Fusion: Profiles<br>Fusion: Campaigns<br>Fusion: Channels<br>Fusion: Campaigns by Device<br>Fusion: Adgroups<br>Fusion: Ads<br>Fusion: Keywords<br>Fusion: Keywords by Device<br>Fusion: Keywords with Content and PLA<br>Fusion: Dynamic Ad Targets<br>Fusion: Product Groups<br>Fusion: Sitelinks<br>Fusion: Audiences<br>Fusion: Audiences by Device                           | FLOAT(40,20) | Conversion total, cntains all “aggregated to conv total” conversion columns<br>Example: `1200`                                                                                                                          |\n| `Cost`                            | Fusion: Profiles<br>Fusion: Campaigns<br>Fusion: Channels<br>Fusion: Campaigns by Device<br>Fusion: Adgroups<br>Fusion: Ads<br>Fusion: Ads by Device<br>Fusion: Keywords<br>Fusion: Keywords by Device<br>Fusion: Keywords with Content and PLA<br>Fusion: Dynamic Ad Targets<br>Fusion: Product Groups<br>Fusion: Sitelinks<br>Fusion: Audiences<br>Fusion: Audiences by Device  | FLOAT(40,20) | Publisher cost, in the currency of the profile<br>Example: `13.12`                                                                                                                                                      |\n| `Avg CPC`                         | Fusion: Profiles<br>Fusion: Campaigns<br>Fusion: Channels<br>Fusion: Campaigns by Device<br>Fusion: Adgroups<br>Fusion: Ads<br>Fusion: Ads by Device<br>Fusion: Keywords<br>Fusion: Keywords by Device<br>Fusion: Keywords with Content and PLA<br>Fusion: Dynamic Ad Targets<br>Fusion: Product Groups<br>Fusion: Sitelinks<br>Fusion: Audiences<br>Fusion: Audiences by Device  | FLOAT(40,20) | Average cost per click<br>Example: `0.64227`                                                                                                                                                                            |\n| `Cost/Conv.`                      | Fusion: Profiles<br>Fusion: Campaigns<br>Fusion: Channels<br>Fusion: Campaigns by Device<br>Fusion: Adgroups<br>Fusion: Ads<br>Fusion: Ads by Device<br>Fusion: Keywords<br>Fusion: Keywords by Device<br>Fusion: Keywords with Content and PLA<br>Fusion: Dynamic Ad Targets<br>Fusion: Product Groups<br>Fusion: Sitelinks<br>Fusion: Audiences<br>Fusion: Audiences by Device  | FLOAT(40,20) | Cost per conversion<br>Example: `1.54`                                                                                                                                                                                  |\n| `Conv. Rate`                      | Fusion: Profiles<br>Fusion: Campaigns<br>Fusion: Channels<br>Fusion: Campaigns by Device<br>Fusion: Adgroups<br>Fusion: Ads<br>Fusion: Ads by Device<br>Fusion: Keywords<br>Fusion: Keywords by Device<br>Fusion: Keywords with Content and PLA<br>Fusion: Dynamic Ad Targets<br>Fusion: Product Groups<br>Fusion: Sitelinks<br>Fusion: Audiences<br>Fusion: Audiences by Device  | FLOAT(40,20) | Average number of conversions per click<br>Example: `0.4`                                                                                                                                                               |\n| `Avg Pos`                         | Fusion: Profiles<br>Fusion: Campaigns<br>Fusion: Channels<br>Fusion: Campaigns by Device<br>Fusion: Adgroups<br>Fusion: Ads<br>Fusion: Ads by Device<br>Fusion: Keywords<br>Fusion: Keywords by Device<br>Fusion: Keywords with Content and PLA<br>Fusion: Dynamic Ad Targets<br>Fusion: Product Groups<br>Fusion: Sitelinks<br>Fusion: Audiences<br>Fusion: Audiences by Device  | FLOAT(40,20) | Average position of the impression<br>Example: `2.1`                                                                                                                                                                    |\n| `Rev.`                            | Fusion: Profiles<br>Fusion: Campaigns<br>Fusion: Channels<br>Fusion: Campaigns by Device<br>Fusion: Adgroups<br>Fusion: Ads<br>Fusion: Ads by Device<br>Fusion: Keywords<br>Fusion: Keywords by Device<br>Fusion: Keywords with Content and PLA<br>Fusion: Dynamic Ad Targets<br>Fusion: Product Groups<br>Fusion: Sitelinks<br>Fusion: Audiences<br>Fusion: Audiences by Device  | FLOAT(40,20) | Total revenue, in the currency of the profile, contains revenue from all “aggregated to conv total” conversion columns<br>Example: `23.34`                                                                              |\n| `ROI`                             | Fusion: Profiles<br>Fusion:\
        \ Campaigns<br>Fusion: Channels<br>Fusion: Campaigns by Device<br>Fusion: Adgroups<br>Fusion: Ads<br>Fusion: Ads by Device<br>Fusion: Keywords<br>Fusion: Keywords by Device<br>Fusion: Keywords with Content and PLA<br>Fusion: Dynamic Ad Targets<br>Fusion: Product Groups<br>Fusion: Sitelinks<br>Fusion: Audiences<br>Fusion: Audiences by Device  | FLOAT(40,20) | Return on investment<br>Example: `11.25`                                                                                                                                                                                |\n| `Rev./Conv.`                      | Fusion: Profiles<br>Fusion: Campaigns<br>Fusion: Channels<br>Fusion: Campaigns by Device<br>Fusion: Adgroups<br>Fusion: Ads<br>Fusion: Ads by Device<br>Fusion: Keywords<br>Fusion: Keywords by Device<br>Fusion: Keywords with Content and PLA<br>Fusion: Dynamic Ad Targets<br>Fusion: Product Groups<br>Fusion: Sitelinks<br>Fusion: Audiences<br>Fusion: Audiences by Device  | FLOAT(40,20) | Revenue per conversion<br>Example: `52.51`                                                                                                                                                                              |\n| `Profit`                          | Fusion: Profiles<br>Fusion: Campaigns<br>Fusion: Channels<br>Fusion: Campaigns by Device<br>Fusion: Adgroups<br>Fusion: Ads<br>Fusion: Ads by Device<br>Fusion: Keywords<br>Fusion: Keywords by Device<br>Fusion: Keywords with Content and PLA<br>Fusion: Dynamic Ad Targets<br>Fusion: Product Groups<br>Fusion: Sitelinks<br>Fusion: Audiences<br>Fusion: Audiences by Device  | FLOAT(40,20) | Revenue minus cost<br>Example: `27511`                                                                                                                                                                                  |\n| `Imp. Share`                      | Fusion: Campaigns<br>Fusion: Adgroups<br>Fusion: Keywords<br>Fusion: Keywords by Device<br>Fusion: Keywords with Content and PLA                                                                                                                                                                                                                                                  | FLOAT(20,8)  | Impression share of the reported entity<br>Example: `0.75`                                                                                                                                                              |\n| `Lost IS-rank`                    | Fusion: Campaigns<br>Fusion: Adgroups<br>Fusion: Keywords<br>Fusion: Keywords by Device<br>Fusion: Keywords with Content and PLA                                                                                                                                                                                                                                                  | FLOAT(20,8)  | Lost impressoin share due to rank<br>Example: `34.5`                                                                                                                                                                    |\n| `Lost-IS budget`                  | Fusion: Campaigns<br>Fusion: Adgroups                                                                                                                                                                                                                                                                                                                                             | FLOAT(20,8)  | Lost impression share due to budget<br>Example: `34.5`                                                                                                                                                                  |\n| `Potential Impressions`           | Fusion: Adgroups<br>Fusion: Keywords<br>Fusion: Keywords by Device                                                                                                                                                                                                                                                                                                                | INT          | Calculated potential impressions given 100% impresions share<br>Example: `100000`                                                                                                                                       |\n"
    asyncReportField:
      required:
      - name
      type: object
      properties:
        display_name:
          type: string
          description: Can be provided to rename the field in the report
        group:
          type: string
          description: Can be provided to display the field group in case any field names exist under multiple groups
          enum:
          - Attributes
          - Performance
          - Dimensions
          - Conversion Types
          - Conversions
        name:
          description: Field name to include in the report
          oneOf:
          - $ref: '#/components/schemas/asyncReportFusionField'
          - $ref: '#/components/schemas/asyncReportStructureField'
          - $ref: '#/components/schemas/asyncReportTrackingField'
      description: Field properties
      example:
      - name: Profile ID
      - name: Ad Group Name
        display_name: AdGroup
      - name: leads
        group: Conversions
    ReportFilter:
      required:
      - field
      - operator
      - values
      type: object
      properties:
        field:
          type: string
          description: Field name to be fetched
        operator:
          type: string
          enum:
          - EQUALS
          - NOT_EQUALS
          - IN
          - NOT_IN
          - GREATER_THAN
          - GREATER_THAN_EQUALS
          - LESS_THAN
          - LESS_THAN_EQUALS
          - STARTS_WITH
          - CONTAINS
          - DOES_NOT_CONTAIN
          - CONTAINS_ANY
          - CONTAINS_NONE
          - ENDS_WITH
          - IS_EMPTY
          - IS_NOT_EMPTY
          - BETWEEN
        values:
          type: array
          items:
            type: string
        group:
          type: string
          description: Each column belongs to a group. This list is partial - your account may have additional column groups. Group names are available in the getAvailableColumns endpoint
          enum:
          - ATTRIBUTES
          - PERFORMANCE
          - DIMENSIONS
          - CUSTOM_METRICS
          - CUSTOM_METRICS_PLUS
          - CONVERSION_TYPES
          - CHANNEL_CUSTOMER_CONVERSION_TYPES
          - PROXY_CUSTOMER_CONVERSION_TYPES
          - EXTERNAL_CUSTOMER_CONVERSION_TYPES
      description: Name of the field to which the condition will apply with certain values.
      example:
      - field: StatusToDisplay
        group: ATTRIBUTES
        operator: In
        values:
        - Approved
        - Active
      - field: CampaignName
        group: ATTRIBUTES
        operator: CONTAINS
        values:
        - New
      - field: Impressions
        group: PERFORMANCE
        operator: GREATER_THAN
        values:
        - '0'
    asyncReportByIdRequest:
      required:
      - dateRange
      type: object
      properties:
        dateRange:
          required:
          - end_date
          - start_date
          type: object
          properties:
            start_date:
              type: string
              description: Start date in YYYY-MM-dd format
            end_date:
              type: string
              description: End date in YYYY-MM-dd format
          description: The date range for this report run (overrides the existing report settings for this run only). _NOTE:_ Analysis grid reports must be created with 'Custom' date range (vs. a preset range like 'Last 7 Days') for the API date override to work.
          example:
            from: '2026-01-01'
            to: '2026-01-14'
      description: The run properties for the requested report
      example:
        dateRange:
          from: '2026-01-01'
          to: '2026-01-14'
    asyncReportTemplateName:
      description: The name of the report
      oneOf:
      - $ref: '#/components/schemas/StructureReportTemplateName'
      - $ref: '#/components/schemas/TrackingReportTemplateName'
      - $ref: '#/components/schemas/FusionReportTemplateName'
    asyncReportRequest:
      required:
      - fields
      - require_yesterday_performance
      - template_name
      type: object
      properties:
        template_name:
          $ref: '#/components/schemas/asyncReportTemplateName'
        start_date:
          type: string
          description: The start date for your report data.
          format: yyyy-MM-dd
        end_date:
          type: string
          description: The end date for your report data.
          format: yyyy-MM-dd
        currency:
          type: string
          description: The currency for all monetary values in the report. In cross-profile reports, use Profile Currency to get all monetary values in each row presented in the currency of this row’s profile. Use any other currency to get all data in the report in the same currency.
          example: USD
          default: Profile Currency
        channels:
          type: array
          description: The channels to include data from in the report.
          example:
          - Google
          - MSN
          items:
            $ref: '#/components/schemas/asyncReportChannel'
          default:
          - All Elements
        custom_file_name:
          type: string
          description: Enter any text and attribute (parameters) to include in the filename of the generated reports.
        compress_method:
          type: string
          description: How you want the file to be compressed.
          enum:
          - ZIP
          - GZIP
          default: GZIP
        delimiter:
          type: string
          description: The character used to separate the values in the report.
          enum:
          - ','
          - /
          - Tab
          - '|'
          default: Tab
        require_yesterday_performance:
          type: boolean
          description: Whether the report should only be sent once performance data from the previous day is ready.
        include_revenue_columns:
          type: boolean
          description: Whether the report includes a revenue column for each selected conversion or conversion type column.
          default: false
        selected_profile_ids:
          type: array
          description: The IDs of Skai profiles to include in the report. When this parameter is not used, all profile IDs to which the user has access are included in the report.
        entity_level:
          type: string
          description: 'The entity level of the report. Relevant for Structure Data: Dimensions report only.'
          enum:
          - Ad
          - Keyword
          - Ad Group
          - Campaign
          - Profile
        dimensions:
          type: string
          description: 'The dimensions to include in the report. Relevant for Structure Data: Dimensions report only.'
          default: All Elements
        fields:
          type: array
          description: The fields to include in the report.
          items:
            $ref: '#/components/schemas/asyncReportField'
      description: The properties for the report request
      example:
        template_name: 'Fusion: Ads'
        start_date: '2026-01-01'
        end_date: '2026-01-14'
        currency: USD
        channels:
        - Google
        fields:
        - name: Clicks
        custom_file_name: Name test
        compress_method: ZIP
        delimiter: Tab
        require_yesterday_performance: 'true'
        include_revenue_columns: 'false'
        selected_profile_ids:
        - 401
        - 402
    TrackingReportTemplateName:
      type: string
      description: One of the available Tracking Reports.
      enum:
      - Tracking Raw Data - Click Tracking Data
      - Tracking Raw Data - Keywords Daily Performance
      - Tracking Raw Data - Flat P2C
    AsyncAnalysis:
      required:
      - date_range
      - entity
      - fields
      type: object
      properties:
        entity:
          $ref: '#/components/schemas/ReportEntity'
        date_range:
          $ref: '#/components/schemas/DateRange'
        fields:
          uniqueItems: true
          type: array
          description: 'The columns to be fetched. See [here](#operation/getAvailableColumns) for available columns.

            To get data segmented by date, add a date column, like so: `{"name": "Day", "group": "TimeSegment"}`'
          items:
            $ref: '#/components/schemas/Column'
        filters:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/ReportFilter'
        sort:
          $ref: '#/components/schemas/ReportSort'
        info_level:
          type: string
          description: Show summary records only, breakdown records only, or both.
          enum:
          - SUMMARY
          - BREAKDOWN
          - BOTH
          default: BOTH
        breakdown_type:
          type: string
          description: To get data segmented only by date, use `GROUP`. To segment by both date and another column, use `SEGMENT` with only the date column in group_bys and include the other column in `fields` (these columns will be fetched). Otherwise, use `FLAT`
          enum:
          - FLAT
          - GROUP
          - SEGMENT
          default: FLAT
        group_bys:
          type: Array
          description: When the breakdown type is "GROUP", select columns by which to group the data. Often, this would be the date column (see example) and the ID of the entity you are pulling.
        profile_token:
          type: string
          description: Profile token. Either profile token or profile ID is needed to access [Single-Profile columns](#operation/getAvailableColumns) (alternative to profile_id).
        profile_id:
          type: number
          description: Profile ID. Either profile token or profile ID is needed to access [Single-Profile columns](#operation/getAvailableColumns) (alternative to profile_token).
        custom_file_name:
          type: string
          description: Enter any text and attribute (parameters) to include in the filename of the generated reports.
        compress_method:
          type: string
          description: How you want the file to be compressed.
          enum:
          - ZIP
          - GZIP
          default: GZIP
        skip_zero_performance_rows:
          type: boolean
          description: When set to true, the report includes only rows with performance data greater than 0. When set to false, all rows will be returned, even if there is no performance data. Relevant grids - `CAMPAIGN`, `ADGROUP`, `AD`, `KEYWORD`. This parameter has no effect on other grids.
          default: false
      description: The properties for the async analysis request
      example:
        entity: CAMPAIGN
        profile_id: 118
        date_range:
          start_date: '2026-01-01'
          end_date: '2026-01-14'
        info_level: BREAKDOWN
        fields:
        - name: CampaignName
          group: ATTRIBUTES
        - name: Clicks
          group: PERFORMANCE
        - name: Day
          group: TimeSegment
        filters:
        - field: StatusToDisplay
          group: ATTRIBUTES
          operator: In
          values:
          - Approved
          - Active
        - field: CampaignName
          group: ATTRIBUTES
          operator: CONTAINS
          values:
          - My
        - field: Impressions
          group: PERFORMANCE
          operator: GREATER_THAN
          values:
          - '0'
        sort:
          field: CampaignName
          group: ATTRIBUTES
          order: DESCENDING
        breakdown_type: GROUP
        group_bys:
        - name: Day
          group: TimeSegment
        customFileName: my_report
        compressMethod: ZIP
        skip_zero_performance_rows: true
    StructureReportTemplateName:
      type: string
      description: One of the available Structure Reports.
      enum:
      - 'Structure Data: Ads'
      - 'Structure Data: Keywords'
      - 'Structure Data: Ad Groups'
      - 'Structure Data: Product Groups'
      - 'Structure Data: Campaigns'
      - 'Structure Data: Channels'
      - 'Structure Data: Dimensions'
      - 'Structure Data: Profiles'
      - 'Structure Data: Sitelinks'
    Column:
      required:
      - group
      - name
      type: object
      properties:
        name:
          type: string
          description: Field name to be fetched
        group:
          type: string
          description: Each column belongs to a group. This list is partial - your account may have additional column groups. Group names are available in the getAvailableColumns endpoint
          enum:
          - Attributes
          - Performance
          - Dimensions
          - CustomMetrics
          - CustomMetricsPlus
          - ConversionTypes
          - ChannelCustomerConversionTypes
          - ProxyCustomerConversionTypes
          - ExternalCustomerConversionTypes
        id:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        value_type:
          type: string
          readOnly: true
          enum:
          - STRING
          - INTEGER
          - FLOAT
          - BOOLEAN
          - DATE
      description: The properties of a field
      example:
      - name: Clicks
        group: Performance
    asyncReportStructureField:
      type: string
      description: "\n<style>\n  table th:first-of-type {width: 25%;}\n  table th:nth-of-type(2) {width: 35%;}\n  table th:nth-of-type(3) {width: 5%;}\n  table th:nth-of-type(4) {width: 35%;}\n</style>\n\n| Field name                      | Reports the field is available in                                                                                                                                                                                                                              | Data type   | Description                                                                                                                                                                                                             |\n|---------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|-------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n| `Profile Name`                  | Structure Data: Profiles<br>Structure Data: Campaigns<br>Structure Data: Channels<br>Structure Data: Ad Groups<br>Structure Data: Keywords<br>Structure Data: Ads<br>Structure Data: Product Groups<br>Structure Data: Sitelinks                               | TEXT(50)    | Profile name in Skai<br>Example: `ACME Brand`                                                                                                                                                                        |\n| `Profile ID`                    | Structure Data: Profiles<br>Structure Data: Campaigns<br>Structure Data: Channels<br>Structure Data: Ad Groups<br>Structure Data: Keywords<br>Structure Data: Ads<br>Structure Data: Product Groups<br>Structure Data: Sitelinks<br>Structure Data: Dimensions | INT         | Profile ID in Skai<br>Example: `102`                                                                                                                                                                                 |\n| `Profile Currency`              | Structure Data: Profiles<br>Structure Data: Campaigns<br>Structure Data: Channels<br>Structure Data: Ad Groups<br>Structure Data: Keywords<br>Structure Data: Ads<br>Structure Data: Product Groups                                                            | TEXT(10)    | Currency in which all monetary values under this profile will be stored in Skai. Any other currencies will be converted upon processing.<br>Format: 3-character ISO 4217 currency code<br>Example: `USD`             |\n| `Time Zone`                     | Structure Data: Profiles                                                                                                                                                                                                                                       | TEXT(50)    | Time zone for the profile<br>All data reported for the profile will be displayed in this time zone.<br>Example: `US/Eastern`                                                                                            |\n| `Profile Token`                 | Structure Data: Profiles                                                                                                                                                                                                                                       | TEXT(50)    | Unique value assigned to all Skai profiles. Used in configuration of event tracking such as the Skai infinity tag.<br>Example: `1acbf593-7551-4aea-83d0-711f4446320e`                                             |\n| `Create Date`                   | Structure Data: Profiles                                                                                                                                                                                                                                       | DATETIME    | Date and time the profile was created<br>Format: `yyyy-MM-dd HH:mm:ss`<br>Example: `2026-01-01 00:00:00`                                                                                                                  |\n| `Last Modified`                 | Structure Data: Profiles<br>Structure Data: Campaigns<br>Structure Data: Channels<br>Structure Data: Ad Groups<br>Structure Data: Keywords<br>Structure Data: Product Groups<br>Structure Data: Dimensions                                                     | DATETIME    | Date and time the profile was last modified<br>Format: `yyyy-MM-dd HH:mm:ss`<br>Example: `2026-01-01 00:00:00`                                                                                                            |\n| `Status`                        | Structure Data: Campaigns<br>Structure Data: Channels<br>Structure Data: Ad Groups<br>Structure Data: Keywords<br>Structure Data: Ads<br>Structure Data: Product Groups                                                                                        | TEXT(50)    | Status of the reported entity<br>Valid values: `Active`, `Paused`, `Deleted`, `Pending`, `Inactive`, `Disapproved`, `Approved`, `Failed`, `To Pause`, `To Delete`, `Failed to Pause`, `Failed to Delete`                |\n| `Channel`                       | Structure Data: Campaigns<br>Structure Data: Channels<br>Structure Data: Ad Groups<br>Structure Data: Keywords<br>Structure Data: Ads<br>Structure Data: Product Groups<br>Structure Data: Sitelinks<br>Structure Data: Dimensions                             | TEXT(50)    | Name of the publisher<br>Example: `Google`                                                                                                                                                                              |\n| `Channel Account ID`            | Structure Data: Campaigns<br>Structure Data: Channels<br>Structure Data: Ad Groups<br>Structure Data: Keywords<br>Structure Data: Ads<br>Structure Data: Sitelinks                                                                                             | INT         | ID of this publisher account, in Skai<br>Example: `408`                                                                                                                                                              |\n| `Unique Channel Account ID`     | Structure Data: Campaigns<br>Structure Data: Ad Groups<br>Structure Data: Sitelinks                                                                                                                                                                            | BIGINT      | Unique ID of this publisher account, in Skai. Will be identical for several instances of the same account, across multiple profiles.<br>Example: `102`                                                               |\n| `Channel Account Publisher ID`  | Structure Data: Campaigns<br>Structure Data: Channels<br>Structure Data: Ad Groups<br>Structure Data: Keywords<br>Structure Data: Ads<br>Structure Data: Product Groups<br>Structure Data: Sitelinks<br>Structure Data: Dimensions                             | INT         | ID of this publisher account, in the publisher<br>Example: `123456789`                                                                                                                                                  |\n| `Channel Type ID`               | Structure Data: Channels                                                                                                                                                                                                                                       | INT         | Skai numeric identifier for the name of the publisher:<br>1 - Google<br>2 - Bing (MSN)<br>3 - Yahoo<br>4 - Yandex<br>5 - Baidu<br>Example: `1`                                                                       |\n| `Channel Currency`              | Structure Data: Channels                                                                                                                                                                                                                                       | TEXT(10)    | Reported currency from the publisher<br>Example: `USD`                                                                                                                                                                  |\n| `Account Name`                  | Structure Data: Campaigns<br>Structure Data: Channels<br>Structure Data: Ad Groups<br>Structure Data: Keywords<br>Structure Data: Ads                                                                                                                          | TEXT(255)   | Name of the account, if available, or the username configured in Skai to access the account<br>Example: `Northwest_Google`                                                                                           |\n| `Account Status`                | Structure Data: Campaigns<br>Structure Data: Ad Groups<br>Structure Data: Keywords<br>Structure Data: Ads<br>Structure Data: Product Groups<br>Structure Data: Dimensions                                                                                      | TEXT(50)    | Status of the publisher in Skai<br>Valid values: `Active`, `Paused`                                                                                                                                                  |\n| `Campaign Name`                 | Structure Data: Campaigns<br>Structure Data: Ad Groups<br>Structure Data: Keywords<br>Structure Data: Ads<br>Structure Data: Product Groups<br>Structure Data: Sitelinks                                                                                       | TEXT(255)   | Campaign name in Skai<br>Example: `ACME Brand Clothing`                                                                                                                                                              |\n| `Campaign ID`                   | Structure Data: Campaigns<br>Structure Data: Ad Groups<br>Structure Data: Keywords<br>Structure Data: Ads<br>Structure Data: Product Groups<br>Structure Data: Sitelinks                                                                                       | BIGINT      | Campaign ID in Skai<br>Example: `1123`                                                                                                                                                                               |\n| `Channel Campaign ID`           | Structure Data: Campaigns<br>Structure Data: Ad Groups<br>Structure Data: Keywords<br>Structure Data: Ads<br>Structure Data: Product Groups<br>Structure Data: Sitelinks                                                                                       | BIGINT      | Campaign ID in the publisher<br>Example: `121270991`                                                                                                                                                                    |\n| `Campaign Status`               | Structure Data: Ad Groups<br>Structure Data: Keywords<br>Structure Data: Ads<br>Structure Data: Product Groups<br>Structure Data: Sitelinks                                                                                                                    | TEXT(50)    | Status of the campaign<br>Valid values: `Active`, `Paused`, `Deleted`, `Pending`, `Inactive`, `Disapproved`, `Approved`, `Failed`, `To Pause`, `To Delete`, `Failed to Pause`, `Failed to Delete`                       |\n| `Campaign Start Date`           | Structure Data: Campaigns                                                                                                                                                                                                                                      | DATETIME    | Date and time the campaign starts<br>Format: `yyyy-MM-dd HH:mm:ss`<br>Example: `2026-01-01 00:00:00`                                                                                                                      |\n| `Campaign End Date`             | Structure Data: Campaigns                                                                                                                                                                                                                                      | DATETIME    | Date and time the campaign ends<br>Format: `yyyy-MM-dd HH:mm:ss`<br>Example: `2026-01-01 00:00:00`                                                                                                                        |\n| `Campaign Creation Date`        | Structure Data: Campaigns                                                                                                                                                                                                                                      | DATETIME    | Date and time the campaign was created<br>Format: `yyyy-MM-dd HH:mm:ss`<br>Example: `2026-01-01 00:00:00`                                                                                                                 |\n| `Daily Budget`                  | Structure Data: Campaigns                                                                                                                                                                                                                                      | FLOAT(20,8) | Daily budget of the campaign, in the currency of the profile<br>Example: `100`                                                                                                                                          |\n| `Geo Targeting countries`       | Structure Data: Campaigns                                                                                                                                                                                                                                      | TEXT(3000)  | List of countries targeted by this campaign, comma delimited <br>Example: `Andorra,Afghanistan,Albania,Bangladesh`                                                                                                      |\n| `Geo Targeting territories`     | Structure Data: Campaigns                                                                                                                                                                                                                                      | TEXT(3000)  | List of territories targeted by this campaign, comma delimited <br>Example: `Saint Petersburg,Russia,Tambov Oblast,Russia,Republic of Tatarstan,Russia`                                                                 |\n| `Tracking Level`                | Structure Data: Campaigns                                                                                                                                                                                                                                      | TEXT(20)    | Tracking level of the campaign <br>Valid values: `Keywords`, `Ads`, `Ads + Keywords`, `Profile Default`, `None`                                                                                                         |\n| `Mirroring Status`              | Structure Data: Campaigns                                                                                                                                                                                                                                      | TEXT(30)    | Mirroring status of this campaig, if mirrored<br>Valid values: `Source`, `Destination`, `Errors on Destination`                                                                                                         |\n| `Default Landing Page`          | Structure Data: Campaigns                                                                                                                                                                                                                                      | TEXT(255)   | Name of the entity<br>Example: `Google North America`                                                                                                                                                                   |\n| `Device targeting`              | Structure Data: Campaigns                                                                                                                                                                                                                                      | TEXT(100)   | Device targeting enabled for this campaign, comma delimited if several devices<br>Valid values: `desktop`, `high_end_mobile`, `wap_mobile`, `tablet`                                                                    |\n| `Network`                       | Structure Data: Campaigns                                                                                                                                                                                                                                      | TEXT(128)   | Comma delimited list of networks used in this campaign<br>Example: `Content Network, Search Network`                                                                                                                    |\n| `Failure Reason`                | Structure Data: Campaigns                                                                                                                                                                                                                                      | TEXT(250)   | Latest error recorded upon failed attempt to sync this campaign to the publisher<br>Example: `Trying to create a duplicate campaign`                                                                                    |\n| `Portfolio ID`                  | Structure Data: Campaigns                                                                                                                                                                                                                                      | INT         | ID of the portfolio in Skai<br>Example: `1234`                                                                                                                                                                       |\n| `Portfolio Name`                | Structure Data: Campaigns                                                                                                                                                                                                                                      | TEXT(200)   | Name of the portfolio in Skai<br>Example: `Non-Brand`                                                                                                                                                                |\n| `Search Bid`                    | Structure Data: Campaigns<br>Structure Data: Ad Groups                                                                                                                                                                                                         | FLOAT(20,8) | Default bid for Search, in the currency of the profile<br>Example: `1`                                                                                                                                                  |\n| `Content Bid`                   | Structure Data: Campaigns<br>Structure Data: Ad Groups                                                                                                                                                                                                         | FLOAT(20,8) | Default bid for Content, in the currency of the profile<br>Example: `1`                                                                                                                                                 |\n| `Mobile Bid Adjustment`         | Structure Data: Campaigns<br>Structure Data: Ad Groups<br>Structure Data: Keywords                                                                                                                                                                             | INT         | Mobile bid adjustment, in the currency of the profile<br>Example: `-50`                                                                                                                                                 |\n| `Tablet Bid Adjustment`         | Structure Data: Campaigns<br>Structure Data: Ad Groups                                                                                                                                                                                                         | INT         | Tablet bid adjustment, in the currency of the profile<br>Example: `-50`                                                                                                                                                 |\n| `Desktop Bid Adjustment`        | Structure Data: Campaigns<br>Structure Data: Ad Groups                                                                                                                                                                                                         | INT         | Desktop bid adjustment, in the currency of the profile<br>Example: `-50`                                                                                                                                                |\n| `Ad Group Name`                 | Structure Data: Ad Groups<br>Structure Data: Keywords<br>Structure Data: Ads<br>Structure Data: Product Groups                                                                                                                                                 | TEXT(256)   | Name of the ad group<br>Example: `Northwest Region Trucks`                                                                                                                                                              |\n| `Ad Group ID`                   | Structure Data: Ad Groups<br>Structure Data: Keywords<br>Structure Data: Ads<br>Structure Data: Product Groups                                                                                                                                                 | BIGINT      | Ad group ID in Skai<br>Example: `2124`                                                                                                                                                                               |\n| `AdGroup Status`                | Structure Data: Keywords<br>Structure Data: Ads<br>Structure Data: Product Groups<br>Structure Data: Sitelinks                                                                                                                                                 | TEXT(50)    | Status of the ad group<br>Valid values: `Active`, `Paused`, `Deleted`, `Pending`, `Inactive`, `Disapproved`, `Approved`, `Failed`, `To Pause`, `To Delete`, `Failed to Pause`, `Failed to Delete`                       |\n| `Channel Ad Group ID`           | Structure Data: Ad Groups<br>Structure Data: Keywords<br>Structure Data: Ads<br>Structure Data: Product Groups                                                                                                                                                 | BIGINT      | Ad group ID in the publisher<br>Example: `15782818485`                                                                                                                                                                  |\n| `AdGroup Creation Date`         | Structure Data: Ad Groups                                                                                                                                                                                                                                      | DATETIME    | Date and time the ad group was created<br>Format: `yyyy-MM-dd HH:mm:ss`<br>Example: `2026-01-01 00:00:00`                                                                                                                 |\n| `Number of Expanded Text Ads`   | Structure Data: Ad Groups                                                                                                                                                                                                                                      | INT         | Number of expanded text ads in this ad group<br>Example: `4`                                                                                                                                                            |\n| `Quality Score`                 | Structure Data: Keywords<br>Structure Data: Ads                                                                                                                                                                                                                | INT         | Quality score of the reported entity<br>Example: `3`                                                                                                                                                                    |\n| `Tracking ID`                   | Structure Data: Keywords<br>Structure Data: Ads<br>Structure Data: Product Groups                                                                                                                                                                              | BIGINT      | ID used for tracking in Skai<br>Example: `1123`                                                                                                                                                                      |\n| `Land URL`                      | Structure Data: Keywords<br>Structure Data: Ads                                                                                                                                                                                                                | TEXT(2100)  | Destination URL (for non-upgraded ads) or Final URL (for upgraded ads)<br>Example: `http://www.url.com`                                                                                                                 |\n| `Mobile URL`                    | Structure Data: Keywords<br>Structure Data: Ads<br>Structure Data: Sitelinks                                                                                                                                                                                   | TEXT(3000)  | URL for mobile-optimized destination<br>Example: `http://m.url.com`                                                                                                                                                     |\n| `Upgr. URL Ind.`                | Structure Data: Keywords<br>Structure Data: Ads<br>Structure Data: Sitelinks                                                                                                                                                                                   | TEXT(10)    | Upgraded URL indicator, TRUE if the URL is upgraded<br>Valid values: `TRUE`, `FALSE`                                                                                                                                    |\n| `Tracking Template`             | Structure Data: Keywords<br>Structure Data: Ads<br>Structure Data: Sitelinks                                                                                                                                                                                   | TEXT(3000)  | Tracking template of the entity (applicable for upgraded URLs)<br>Example: `http://www.track.com?url={lpurl}`                                                                                                           |\n| `Custom Parameter 1`            | Structure Data: Keywords<br>Structure Data: Ads<br>Structure Data: Sitelinks                                                                                                                                                                                   | TEXT(500)   | First custom parameter name and value for upgraded URLs<br>Example: `{_paramname1} paramvalue1`                                                                                                                         |\n| `Custom Parameter 2`            | Structure Data: Keywords<br>Structure Data: Ads<br>Structure Data: Sitelinks                                                                                                                                                                                   | TEXT(500)   | Second custom parameter name and value for upgraded URLs<br>Example: `{_paramname2} paramvalue2`                                                                                                                        |\n| `Custom Parameter 3`            | Structure Data: Keywords<br>Structure Data: Ads<br>Structure Data: Sitelinks                                                                                                                                                                                   | TEXT(500)   | Third custom parameter name and value for upgraded URLs<br>Example: `{_paramname3} paramvalue3`                                                                                                                         |\n| `Disapproval Reason`            | Structure Data: Keywords<br>Structure Data: Ads                                                                                                                                                                                                                | TEXT(250)   | Latest publisher disapproval reason<br>Example: `Phone numbers are not allowed in ad text`                                                                                                                              |\n| `Bid`                           | Structure Data: Keywords<br>Structure Data: Product Groups                                                                                                                                                                                                     | FLOAT(20,8) | Bid of the reported element, in the currency of the profile<br>Example: `1.50`                                                                                                                                          |\n| `Keyword`                       | Structure Data: Keywords                                                                                                                                                                                                                                       | TEXT(4096)  | Keyword text<br>Example: `Small Hybrid Cars`                                                                                                                                                                            |\n| `Keyword ID`                    | Structure Data: Keywords                                                                                                                                                                                                                                       | BIGINT      | Keyword ID in Skai<br>Example: `1234`                                                                                                                                                                                |\n| `Channel Keyword ID`            | Structure Data: Keywords                                                                                                                                                                                                                                       | BIGINT      | Keyword ID in the publisher<br>Example: `1145221822`                                                                                                                                                                    |\n| `Match Type`                    | Structure Data: Keywords                                                                                                                                                                                                                                       | TEXT(50)    | Match type of the keyword<br>Valid values: `Exact`, `Phrase`, `Broad`                                                                                                                                                   |\n| `Mobile effective bid`          | Structure Data: Keywords                                                                                                                                                                                                                                       | FLOAT(20,8) | Mobile effective bid, in the currency of the profile<br>Example: `5`                                                                                                                                                    |\n| `Min. Bid`                      | Structure Data: Keywords                                                                                                                                                                                                                                       | FLOAT(20,8) | Minimum allowed bid, in the currency of the profile<br>Example: `1.50`                                                                                                                                                  |\n| `Keyword Creation Date`         | Structure Data: Keywords                                                                                                                                                                                                                                       | DATETIME    | Date and time the keyword was created<br>Format: `yyyy-MM-dd HH:mm:ss`<br>Example: `2026-01-01 00:00:00`                                                                                                                  |\n| `Ad ID`                         | Structure Data: Ads                                                                                                                                                                                                                                            | BIGINT      | Ad ID in Skai<br>Example: `2124`                                                                                                                                                                                     |\n| `Channel Ad ID`                 | Structure Data: Ads                                                                                                                                                                                                                                            | BIGINT      | Ad ID in the publisher<br>Example: `121270991`                                                                                                                                                                          |\n| `Ad Type`                       | Structure Data: Ads                                                                                                                                                                                                                                            | TEXT(50)    | Ad type<br>Valid values: `Text`, `Image`, `Mobile Text`, `Product`, `Dynamic Search`, `App Install`, `Image App Install`, `Call Only`, `Facebook`*<br>Note: All Facebook ad types display as “Facebook” in this report. |\n| `Headline`                      | Structure Data: Ads                                                                                                                                                                                                                                            | TEXT(255)   | Headline of the ad<br>Example: `Chicago Cars 2016`                                                                                                                                                                      |\n| `Headline 2`                    | Structure Data: Ads                                                                                                                                                                                                                                            | TEXT(255)   | Headline 2 of the ad<br>Example: `Chicago Cars 2016`                                                                                                                                                                    |\n| `Line 1`                        | Structure Data: Ads                                                                                                                                                                                                                                            | TEXT(255)   | Line 1 of the ad<br>Example: `Visit url.com today`                                                                                                                                                                      |\n| `Display URL`                   | Structure Data: Ads                                                                                                                                                                                                                                            | TEXT(255)   | Display URL of the ad<br>Example: `url.com`                                                                                                                                                                             |\n| `Line 2`                        | Structure Data: Ads                                                                                                                                                                                                                                            | TEXT(255)   | Line 2 of the ad<br>Example: `for massive discounts`                                                                                                                                                                    |\n| `Path 1`                        | Structure Data: Ads                                                                                                                                                                                                                                            | TEXT(15)    | Part 1 of the path added to the display URL after your website’s domain<br>Example: `products`                                                                                                                          |\n| `Path 2`                        | Structure Data: Ads                                                                                                                                                                                                                                            | TEXT(15)    | Part 2 of the path added to the display URL after your website’s domain<br>Example: `shoes`                                                                                                                             |\n| `Image Name`                    | Structure Data: Ads                                                                                                                                                                                                                                            | TEXT(256)   | Name of the image used in the ad<br>Example: `sunset_120*120.png`                                                                                                                                                       |\n| `ASIN`                          | Structure Data: Ads                                                                                                                                                                                                                                            | TEXT(50)    | ASIN of the product that was promoted in each ad, for ecommerce publishers<br>Example: `B07FSYQT23`                                                                                                                     |\n| `Promotion`                     | Structure Data: Ads                                                                                                                                                                                                                                            | TEXT(255)   | Promotion line of product listing ads, blank for other ad types<br>Example: `Free Shipping & Free Returns`                                                                                                              |\n| `Last Updated`                  | Structure Data: Ads                                                                                                                                                                                                                                            | DATETIME    | Date and time the element was last modified<br>Format: `yyyy-MM-dd HH:mm:ss`<br>Example: `2026-01-01 00:00:00`                                                                                                            |\n| `Device Preference`             | Structure Data: Ads<br>Structure Data: Sitelinks                                                                                                                                                                                                               | TEXT(50)    | Preferred device<br>Valid values: `All`, `Mobile`                                                                                                                                                                       |\n| `Sitelink Text`                 | Structure Data: Sitelinks                                                                                                                                                                                                                                      | TEXT(35)    | Text of the sitelink<br>Example: `Accessories`                                                                                                                                                                          |\n| `Sitelink ID`                   | Structure Data: Sitelinks                                                                                                                                                                                                                                      | BIGINT      | Sitelink ID in Skai<br>Example: `1123`                                                                                                                                                                               |\n| `Channel Sitelink ID`           | Structure Data: Sitelinks                                                                                                                                                                                                                                      | TEXT(100)   | Sitelink ID in the publisher<br>Example: `1123`                                                                                                                                                                         |\n| `Sitelink Description1`         | Structure Data: Sitelinks                                                                                                                                                                                                                                      | TEXT(255)   | Description 1 of the sitelink<br>Example: `This is a sitelink`                                                                                                                                                          |\n| `Sitelink Description2`         | Structure Data: Sitelinks                                                                                                                                                                                                                                      | TEXT(255)   | Description 2 of the sitelink<br>Example: `This is a sitelink`                                                                                                                                                          |\n| `Sitelink URL`                  | Structure Data: Sitelinks                                                                                                                                                                                                                                      | TEXT(3000)  | URL of the sitelink<br>Example: `http://www.url.com`                                                                                                                                                                    |\n| `Sitelink Status`               | Structure Data: Sitelinks                                                                                                                                                                                                                                      | TEXT(50)    | Status of the sitelink<br>Valid values: `Active`, `Paused`, `Deleted`, `Pending`, `Inactive`, `Disapproved`, `Approved`, `Failed`, `To Pause`, `To Delete`, `Failed to Pause`, `Failed to Delete`                       |\n| `Adgroup ID`                    | Structure Data: Sitelinks                                                                                                                                                                                                                                      | BIGINT      | Ad group ID in Skai<br>Example: `2124`                                                                                                                                                                               |\n| `Channel Adgroup ID`            | Structure Data: Sitelinks                                                                                                                                                                                                                                      | BIGINT      | Ad group ID in the publisher<br>Example: `15782818485`                                                                                                                                                                  |\n| `adGroup Name`                  | Structure Data: Sitelinks                                                                                                                                                                                                                                      | TEXT(256)   | Name of the ad group<br>Example: `Northwest Region Trucks`                                                                                                                                                              |\n| `Account SiteLink`              | Structure Data: Sitelinks                                                                                                                                                                                                                                      | TEXT(10)    | Indicates if the sitelink was assigned to an account<br>Valid values: `Yes`, `No`                                                                                                                                       |\n| `Device Target`                 | Structure Data: Sitelinks                                                                                                                                                                                                                                      | TEXT(100)   | Device targeting enabled for this sitelink, comma delimited if several devices<br>Valid values: `desktop`, `high_end_mobile`, `wap_mobile`, `tablet`                                                                    |\n| `Sitelink Feed ID`              | Structure Data: Sitelinks                                                                                                                                                                                                                                      | TEXT(100)   | Feed ID of the sitelink<br>Example: `1234`                                                                                                                                                                              |\n| `Sitelinks Schedule Start Date` | Structure Data: Sitelinks                                                                                                                                                                                                                                      | DATETIME    | Date the sitelink schedule starts<br>Format: `yyyy-MM-dd HH:mm:ss`<br>Example: `2026-01-01 00:00:00`                                                                                                                      |\n| `Sitelinks Schedule End Date`   | Structure Data: Sitelinks                                                                                                                                                                                                                                      | DATETIME    | Date the sitelink schedule ends<br>Format: `yyyy-MM-dd HH:mm:ss`<br>Example: `2026-01-01 00:00:00`                                                                                                                        |\n| `Product Group`                 | Structure Data: Product Groups                                                                                                                                                                                                                                 | TEXT(4000)  | Name of the product group<br>Example: `ALL/Domestic/Tools`                                                                                                                                                              |\n| `Channel Product Group ID`      | Structure Data: Product Groups                                                                                                                                                                                                                                 | BIGINT      | Product group ID in the publisher<br>Example: `65244597854`                                                                                                                                                             |\n| `Product Group Level 0`         | Structure Data: Product Groups                                                                                                                                                                                                                                 | TEXT(500)   | Level 0 of the product group definition<br>Example: `ALL`                                                                                                                                                               |\n| `Product Group Level 1`         | Structure Data: Product Groups                                                                                                                                                                                                                                 | TEXT(500)   | Level 1 of the product group definition<br>Example: `Domestic`                                                                                                                                                          |\n| `Product Group Level 2`         | Structure Data: Product Groups                                                                                                                                                                                                                                 | TEXT(500)   | Level 2 of the product group definition<br>Example: `Tools`                                                                                                                                                             |\n| `Product Group Level 3`         | Structure Data: Product Groups                                                                                                                                                                                                                                 | TEXT(500)   | Level 3 of the product group definition<br>Example: `Tools`                                                                                                                                                             |\n| `Product Group Level 4`         | Structure Data: Product Groups                                                                                                                                                                                                                                 | TEXT(500)   | Level 4 of the product group definition<br>Example: `Tools`                                                                                                                                                             |\n| `Product Group Level 5`         | Structure Data: Product Groups                                                                                                                                                                                                                                 | TEXT(500)   | Level 5 of the product group definition<br>Example: `Tools`                                                                                                                                                             |\n| `Product Group Level 6`         | Structure Data: Product Groups                                                                                                                                                                                                                                 | TEXT(500)   | Level 6 of the product group definition<br>Example: `Tools`                                                                                                                                                             |\n| `Product Group Level 7`         | Structure Data: Product Groups                                                                                                                                                                                                                                 | TEXT(500)   | Level 7 of the product group definition<br>Example: `Tools`                                                                                                                                                             |\n| `Biddable`                      | Structure Data: Product Groups                                                                                                                                                                                                                                 | TEXT(10)    | Indicates if the product group is biddable. Non-biddable product groups are higher in the hierarchy and cannot have a bid of their own.<br>Valid values: `Yes`, `No`                                                    |\n| `Destination URL`               | Structure Data: Product Groups                                                                                                                                                                                                                                 | TEXT(2100)  | Destination URL of the product group. Used for tracking, commonly empty.<br>Example: `http://www.track.com?url={escapedlpurl}`                                                                                          |\n| `Dimension Name`                | Structure Data: Dimensions                                                                                                                                                                                                                                     | TEXT(100)   | Name of the dimension<br>Example: `Brand`                                                                                                                                                                               |\n| `Dimension ID`                  | Structure Data: Dimensions                                                                                                                                                                                                                                     | INT         | Dimension ID in Skai<br>Example: `123`                                                                                                                                                                               |\n| `Category Name`                 | Structure Data: Dimensions                                                                                                                                                                                                                                     | TEXT(100)   | Name of the category<br>Example: `NonBrand`                                                                                                                                                                             |\n| `Category ID`                   | Structure Data: Dimensions                                                                                                                                                                                                                                     | INT         | Category ID in Skai<br>Example: `12`                                                                                                                                                                                 |\n| `Entity Level`                  | Structure Data: Dimensions                                                                                                                                                                                                                                     | TEXT(50)    | Entity level for this report<br>Valid values: `Profile`, `Campaign`, `Ad Group`, `Ad`, `Keyword`                                                                                                                        |\n| `Entity Name`                   | Structure Data: Dimensions                                                                                                                                                                                                                                     | TEXT(4096)  | Name of the entity<br>Example: `Google North America`                                                                                                                                                                   |\n| `Entity ID`                     | Structure Data: Dimensions                                                                                                                                                                                                                                     | BIGINT      | Entity ID in Skai<br>Example Campaign ID Value: `1123`                                                                                                                                                               |\n| `Entity ID in Channel`          | Structure Data: Dimensions                                                                                                                                                                                                                                     | BIGINT      | Entity ID in the publisher<br>Example Campaign ID Value: `1123`                                                                                                                                                         |\n"
    ReportSort:
      required:
      - field
      - group
      type: object
      properties:
        field:
          type: string
          description: The field to be sorted
        order:
          type: string
          enum:
          - ASCENDING
          - DESCENDING
          default: ASCENDING
