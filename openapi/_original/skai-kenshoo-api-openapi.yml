  /api/v1/reports:
    post:
      tags:
      - "Synchronous Reports"
      summary: "Fetch a report"
      description: "Fetch reporting data for any entity type across all connected\
        \ publisher accounts.\n\n**Supported entities:** `CAMPAIGN` `ADGROUP` `KEYWORD`\
        \ `AD` `PRODUCT_ASSET` `PRODUCT_TARGETING` `PORTFOLIO`\n\nLess commonly used\
        \ entities — `LOCATIONS`, `NEGATIVE_KEYWORDS`, `SITELINK`, `CREATIVE_ASSET`,\
        \ `ASSET_GROUP` — are also supported. Use [Available Columns](#operation/getAvailableColumns)\
        \ with the relevant entity to retrieve their column lists.\n\n#### Building\
        \ a request\n\n1. **Choose an `entity`** — the grid you want to report on\
        \ (e.g. `CAMPAIGN`).\n2. **Pick your `fields`** — each field needs a `name`\
        \ and a `group`. Use [Available Columns](#operation/getAvailableColumns) to\
        \ browse what's available. The `group` value maps directly to the column group\
        \ names returned by that endpoint (e.g. `ATTRIBUTES`, `PERFORMANCE`, `TimeSegment`).\n\
        3. **Set a `date_range`** — `start_date` and `end_date` in `YYYY-MM-DD` format.\n\
        4. **Add `profile_id` or `profile_token`** if you need single-profile columns\
        \ (dimensions, custom metrics, conversion events). Use `profile_id=0` for\
        \ cross-profile columns only.\n\n#### Pagination\n\nResults are limited to\
        \ 1000 rows per request. Use `page` (0-indexed) to paginate through larger\
        \ result sets. For datasets over a few thousand rows, prefer [Async Analysis\
        \ Reports](#operation/asyncAnalysisReport) — they stream results to a file\
        \ with no row limit.\n\n#### Filtering and sorting\n\nUse `filters` to narrow\
        \ rows before they're returned (e.g. `Impressions > 0` to skip zero-spend\
        \ rows). Use `sort` to order results server-side before pagination is applied."
      operationId: "fetchReport"
      parameters:
      - $ref: "#/components/parameters/ks"
      requestBody:
        $ref: "#/components/requestBodies/ReportRequest"
      responses:
        200:
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportApiResponseDTO"
        400:
          $ref: "#/components/responses/BadRequest"
        500:
          $ref: "#/components/responses/InternalServerError"
    options:
      description: "for cross origin requests"
      parameters:
      - $ref: "#/components/parameters/ks"
      responses:
        200:
          description: "successful operation"
  /api/v1/reports/async/analysis:
    post:
      tags:
      - "Asynchronous Reports"
      summary: "Configure and run an analysis grid report (recommended)"
      description: "Run a report asynchronously and download the results as a file.\
        \ Use this instead of [Synchronous Reports](#operation/fetchReport) when your\
        \ dataset exceeds 1,000 rows, or when you want to avoid blocking on a long-running\
        \ query.\n\nThe request body uses the same `entity`, `fields`, `date_range`,\
        \ `filters`, and `sort` structure as the synchronous report endpoint — refer\
        \ to [Available Columns](#operation/getAvailableColumns) for field names and\
        \ groups.\n\n#### Workflow\n\n**1. Submit** — this endpoint returns immediately.\
        \ The `execution_id` is in the `Location` response header:\n```\nLocation:\
        \ https://api.kenshoo.com/v2/reports/runs/rpx-fec94574-152c-4e47-ba57-e5a4029d652e?ks=1234\n\
        ```\nExtract the path segment after `/runs/` — that is your `execution_id`.\n\
        \n**2. Poll for completion** — [GET /api/v1/reports/async/{execution_id}/status](#operation/getAsyncReportStatus)\n\
        Poll until status is `COMPLETED`. Runtime varies from a few seconds to an\
        \ hour depending on data volume.\n\n**3. Download** — [GET /api/v1/reports/async/{execution_id}](#operation/downloadAsyncReport)\n\
        Returns a compressed file (ZIP or GZIP, set via `compress_method`) containing\
        \ a CSV with all result rows — no row limit.\n\n#### Key parameters\n\n| Parameter\
        \ | Required | Description |\n|---|---|---|\n| `entity` | Yes | Entity type\
        \ to report on (e.g. `CAMPAIGN`, `KEYWORD`) |\n| `fields` | Yes | Columns\
        \ to include — use names from [Available Columns](#operation/getAvailableColumns)\
        \ |\n| `date_range` | Yes | `start_date` and `end_date` in `YYYY-MM-DD` format\
        \ |\n| `profile_id` | Conditional | Required for single-profile columns; use\
        \ `0` for cross-profile columns only |\n| `info_level` | No | `SUMMARY`, `BREAKDOWN`,\
        \ or `BOTH` (default: `BOTH`) |\n| `breakdown_type` | No | `FLAT` (default),\
        \ `GROUP` (segment by date), or `SEGMENT` (date + another column) |\n| `skip_zero_performance_rows`\
        \ | No | Exclude rows with no performance data (default: `false`) |\n\n####\
        \ cURL example\n\n```bash\n# Step 1 — submit the report\ncurl -i -X POST \\\
        \n  'https://services.kenshoo.com/api/v1/reports/async/analysis?ks=<YOUR_KS_ID>'\
        \ \\\n  -H 'Authorization: Bearer <YOUR_TOKEN>' \\\n  -H 'Content-Type: application/json'\
        \ \\\n  -d '{\n    \"entity\": \"CAMPAIGN\",\n    \"profile_id\": 118,\n \
        \   \"date_range\": {\"start_date\": \"2026-01-01\", \"end_date\": \"2026-01-14\"\
        },\n    \"fields\": [\n      {\"name\": \"CampaignName\", \"group\": \"ATTRIBUTES\"\
        },\n      {\"name\": \"Clicks\", \"group\": \"PERFORMANCE\"},\n      {\"name\"\
        : \"Day\", \"group\": \"TimeSegment\"}\n    ]\n  }'\n# Check the Location\
        \ response header for your execution_id\n\n# Step 2 — poll until COMPLETED\n\
        curl 'https://services.kenshoo.com/api/v1/reports/async/<EXECUTION_ID>/status?ks=<YOUR_KS_ID>'\
        \ \\\n  -H 'Authorization: Bearer <YOUR_TOKEN>'\n# {\"status\": \"COMPLETED\"\
        }\n\n# Step 3 — download the file\ncurl -o report.zip \\\n  'https://services.kenshoo.com/api/v1/reports/async/<EXECUTION_ID>?ks=<YOUR_KS_ID>'\
        \ \\\n  -H 'Authorization: Bearer <YOUR_TOKEN>'\n```"
      operationId: "asyncAnalysisReport"
      parameters:
      - $ref: "#/components/parameters/ks"
      requestBody:
        $ref: "#/components/requestBodies/AsyncAnalysis"
      responses:
        200:
          description: "Report execution triggered successfully"
          headers:
            Location:
              description: "The `run_id` of the report will show in this header. Use\
                \ this ID to poll for the report status or to download the report.\
                \ The value will be in this format: `https://api.kenshoo.com/v2/reports/runs/rpx-fec94574-152c-4e47-ba57-e5a4029d652e?ks=1234`.\
                \ In this example, `rpx-fec94574-152c-4e47-ba57-e5a4029d652e` is the\
                \ `execution_id`."
              style: "simple"
              explode: false
              schema:
                type: "string"
          content:
            application/json:
              schema:
                type: "string"
                example: "The response body will be empty. See the Location header\
                  \ to get the Run ID"
        400:
          description: "Invalid report request"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  errorMessage:
                    type: "string"
                    description: "Reason for failure"
        500:
          description: "Server error"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  errorMessage:
                    type: "string"
  /api/v1/bulk_update:
    post:
      tags:
      - "Bulk Update"
      summary: "Make bulk changes to multiple entities"
      description: "Upload a CSV bulksheet to create and update campaigns, ad groups,\
        \ keywords, ads, and more — across dozens of publishers — in a single API\
        \ call.\n\n#### Unmatched publisher breadth\n\nNo other platform offers programmatic\
        \ create and edit operations across this many publishers in one API. Skai's\
        \ Bulk Update covers:\n\n| Category | Publishers |\n|---|---|\n| Search |\
        \ Google Ads, Microsoft Ads, Yahoo Japan, Baidu, and others |\n| Retail Media\
        \ | Amazon (SP/SB/SD), Walmart (SP/SB/SV), Instacart, Criteo, DoorDash, Sam's\
        \ Club, Bol, Topsort, Moloco, Koddi, and 100+ others |\n| Social | Pinterest,\
        \ Snapchat, TikTok, Apple Search Ads |\n| Social (Meta, LinkedIn, Reddit)\
        \ | Dimension assignment and basic status edits |\n\n**Supported operations\
        \ by entity type:**\n\n| Entity | Create | Edit |\n|---|---|---|\n| Campaign\
        \ | Yes | Yes |\n| Ad Group | Yes | Yes |\n| Keyword | Yes | Yes |\n| Ad |\
        \ Yes | Yes |\n| Product Group | — | Yes (dimension assignment) |\n| Target\
        \ | — | Yes (dimension assignment) |\n| Search Term | — | Yes (dimension assignment)\
        \ |\n\nThe file format is identical to what Skai users export and import manually\
        \ in the platform — every attribute visible in the Skai UI is editable through\
        \ this API.\n\n---\n\n#### The bulksheet format\n\nBulksheets are UTF-8 CSV\
        \ files. Each row is one entity. **Use `bulk_update_type=MULTI_ENTITY_FILE`\
        \ (recommended)** — it allows any mix of entity types in a single file using\
        \ an `Entity Type` column as the first column:\n\n```\nEntity Type,Profile\
        \ ID,Campaign ID,Ad Group ID,Campaign Name,Ad Group Name,Keyword,Keyword Match\
        \ Type,Keyword Bid,Status\nCampaign,55,,,,,,,,Active\nAd group,55,1001,,,Brand\
        \ Ad Group,,,, Active\nKeyword,55,1001,5001,,,running shoes,exact,0.50,Active\n\
        ```\n\nIf you need single-entity files, set `bulk_update_type` to the specific\
        \ entity (e.g. `CAMPAIGN`) and omit the `Entity Type` column — though everything\
        \ supported in single-entity mode is also supported in `MULTI_ENTITY_FILE`.\n\
        \n---\n\n#### Editing entities\n\nTo edit, each row needs only three things:\n\
        1. **Entity Type** — `Campaign`, `Ad group`, `Ad`, or `Keyword`\n2. **The\
        \ entity's Skai ID** — `Campaign ID`, `Ad Group ID`, `Ad ID`, or `Keyword\
        \ ID`\n3. **Only the columns you want to change** — all other columns can\
        \ be omitted\n\n> **Skai IDs vs publisher IDs:** Bulksheets use Skai's internal\
        \ IDs, not publisher IDs. Retrieve them via the [Reporting API](#operation/fetchReport)\
        \ — e.g. request the `CampaignId` field on the CAMPAIGN entity.\n\n**Minimal\
        \ edit example — update budgets for 3 campaigns:**\n```\nEntity Type,Campaign\
        \ ID,Campaign Daily Budget\nCampaign,1001,150\nCampaign,1002,200\nCampaign,1003,75\n\
        ```\n\n---\n\n#### Creating entities\n\nTwo methods are supported. Use **IDs**\
        \ when you have them (faster); use **hierarchy names** when you don't.\n\n\
        **ID method** — provide the parent entity's Skai ID. This example creates\
        \ two keywords in an existing ad group (ID 55123):\n```\nEntity Type,Ad Group\
        \ ID,Keyword,Keyword Match Type,Keyword Bid\nKeyword,55123,running shoes,exact,0.50\n\
        Keyword,55123,buy running shoes,broad,0.40\n```\n\n**Hierarchy method** —\
        \ provide the name path instead of IDs. This example creates one keyword by\
        \ identifying its ad group through the Channel Account ID (mandatory), Profile\
        \ Name, Campaign Name, and Ad Group Name:\n```\nEntity Type,Channel Account\
        \ ID,Profile Name,Campaign Name,Ad Group Name,Keyword,Keyword Match Type,Keyword\
        \ Bid\nKeyword,673,Skai Sports - US - Google,Brand Campaign,Brand Ad Group,running\
        \ shoes,exact,0.50\n```\n\n**Minimum required columns for creation:**\n\n\
        | Entity | ID method | Hierarchy method |\n|---|---|---|\n| Campaign | Channel\
        \ Account ID + Profile ID + Campaign Name | Channel Account ID + Profile Name\
        \ + Campaign Name |\n| Ad Group | Campaign ID + Ad Group Name | + Campaign\
        \ Name + Ad Group Name |\n| Ad | Ad Group ID + Ad Type | + Campaign Name +\
        \ Ad Group Name + Ad Type |\n| Keyword | Ad Group ID + Keyword + Keyword Match\
        \ Type | + Campaign Name + Ad Group Name + Keyword + Keyword Match Type |\n\
        \n**Publisher-specific notes:**\n- **Status values differ by publisher type:**\
        \ `Active` / `Paused` (Apple Search Ads); `Approve` / `Pause` (Retail Media);\
        \ `Approved` / `Pause` (Search & most Social)\n- **Retail Media creates**\
        \ require `Campaign Tracking Level = None`\n- Some publishers have additional\
        \ required fields (e.g. Amazon Sponsored Brands requires `Brand entity ID`\
        \ or `Brand entity name`; Pinterest and Snapchat require `Campaign Start Date`).\
        \ Start from an export when working with a new publisher.\n\n---\n\n#### Best\
        \ practices\n\n**Start from an export.** The fastest way to get the correct\
        \ column format for a publisher or campaign type is to export existing entities\
        \ from the Skai UI. The export is identical in format to the import — edit\
        \ the values you need and re-import. This is especially valuable the first\
        \ time you work with a new publisher or campaign type.\n\n**Work with the\
        \ media team first.** When building programmatic bulksheets, get a working\
        \ example verified in the Skai UI with the media team, then implement the\
        \ code to generate it at scale.\n\n**Use minimal columns for edits.** You\
        \ only need the entity ID and the columns you're changing. Omitting unrelated\
        \ columns reduces errors and makes the file easier to debug.\n\n**Use the\
        \ error file — it's readable.** When rows fail, retrieve the error file (see\
        \ below) — you get all failed rows in the original format with a plain-text\
        \ error description appended as the last column. Errors are specific and actionable.\
        \ An AI coding agent can read this file, parse the failures, fix the rows,\
        \ and resubmit without manual intervention.\n\n---\n\n#### Retrieving results\n\
        \nAfter submitting, use the returned `job_id` to poll status and retrieve\
        \ results.\n\n**1. Poll for completion** — [GET /api/v1/jobs/{job_id}/status](#tag/Jobs/paths/~1api~1v1~1jobs~1{job_id}~1status/get)\n\
        Poll until status is `JOB_COMPLETED` or `JOB_COMPLETED_WITH_FAILURES`.\n\n\
        **2. Get the summary** — [GET /api/v1/jobs/{job_id}/results/file](#tag/Jobs/paths/~1api~1v1~1jobs~1{job_id}~1results~1file/get)\
        \ with `info_level=SUMMARY`\nReturns a JSON summary:\n```json\n{\n  \"elementType\"\
        : \"MULTI_ENTITY_FILE\",\n  \"processed\": 25,\n  \"updated\": 23,\n  \"failed\"\
        : 2\n}\n```\n\n**3. Get failed rows** — same endpoint with `info_level=BREAKDOWN`\n\
        Returns a zipped CSV with all failed rows in the original import format, plus\
        \ an error description in the last column."
      operationId: "bulkUpdate"
      parameters:
      - $ref: "#/components/parameters/ks"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: "object"
              properties:
                file:
                  type: "string"
                  description: "CSV, XLSX, TXT, or TSV — uncompressed or zip-compressed.\
                    \ Maximum size 50 MB."
                  format: "binary"
                file_delimiter:
                  type: "string"
                  description: "Column delimiter used in the file. Use `COMMA` for\
                    \ standard CSV."
                  enum:
                  - "COMMA"
                  - "TAB"
                  - "SEMICOLON"
                bulk_update_type:
                  type: "string"
                  description: "The entity type of the uploaded file. Use `MULTI_ENTITY_FILE`\
                    \ (recommended) to mix entity types in one file using an `Entity\
                    \ Type` column. Use a specific entity type for single-entity files."
                  enum:
                  - "MULTI_ENTITY_FILE"
                  - "CAMPAIGN"
                  - "AD_GROUP"
                  - "KEYWORD"
                  - "AD"
                  - "PRODUCT_GROUP"
                  - "PORTFOLIO"
                  - "SITELINK"
                  - "AUDIENCES"
                  - "PROFILE_STATUS"
                  - "PROFILE_F2A"
                  - "PROFILE_ONBOARDING"
        required: true
      responses:
        200:
          description: "Job created successfully"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  job_id:
                    type: "string"
                    description: "Use this ID to poll job status and retrieve results."
              example:
                job_id: "c42f1168-4cd6-42e8-b654-2a7f0043699e"
        400:
          $ref: "#/components/responses/BadRequest"
        500:
          $ref: "#/components/responses/InternalServerError"
      x-code-samples:
      - lang: "cURL"
        source: "curl -X POST \\\n  'https://services.kenshoo.com/api/v1/bulk_update?ks=<YOUR_KS_ID>'\
          \ \\\n  -H 'Authorization: Bearer <YOUR_TOKEN>' \\\n  -F 'file=@changes.csv'\
          \ \\\n  -F 'file_delimiter=COMMA' \\\n  -F 'bulk_update_type=MULTI_ENTITY_FILE'\n\
          \n# Response: {\"job_id\": \"c42f1168-4cd6-42e8-b654-2a7f0043699e\"}\n#\
          \ Then poll: GET /api/v1/jobs/{job_id}/status\n"
