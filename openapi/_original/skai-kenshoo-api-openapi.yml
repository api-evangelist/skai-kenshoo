components:
  schemas:
    ErrorField:
      type: "object"
      properties:
        fieldName:
          type: "string"
          description: "The error field"
        error:
          type: "string"
          description: "Error message"
        parameters:
          type: "object"
          additionalProperties:
            type: "string"
          description: "Error additional properties"
    ApiResponseSummaryReportDTO:
      type: "object"
      properties:
        status:
          $ref: "#/components/schemas/ApiResponseStatus"
        entities:
          type: "array"
          readOnly: true
          items:
            $ref: "#/components/schemas/SummaryReportDTO"
        error_message:
          type: "string"
          readOnly: true
    FusionReportTemplateName:
      type: "string"
      description: "One of the available Fusion Reports."
      enum:
      - "Fusion: Profiles"
      - "Fusion: Channels"
      - "Fusion: Campaigns"
      - "Fusion: Campaigns by Device"
      - "Fusion: Adgroups"
      - "Fusion: Ads"
      - "Fusion: Keywords"
      - "Fusion: Keywords by Device"
      - "Fusion: Keywords with Content and PLA"
      - "Fusion: Dynamic Ad Targets"
      - "Fusion: Product Groups"
      - "Fusion: Sitelinks"
      - "Fusion: Audiences"
      - "Fusion: Audiences by Device"
    ApiResponseTestStructureDTO:
      type: "object"
      properties:
        status:
          $ref: "#/components/schemas/ApiResponseStatus"
        entities:
          type: "array"
          readOnly: true
          items:
            $ref: "#/components/schemas/TestStructureDTO"
        paging:
          $ref: "#/components/schemas/Paging"
        error_message:
          type: "string"
          readOnly: true
    GroupDTO:
      type: "object"
      properties:
        name:
          type: "string"
          readOnly: true
        group_type:
          type: "string"
          readOnly: true
          enum:
          - "BASE"
          - "TEST"
        campaigns:
          type: "array"
          readOnly: true
          items:
            $ref: "#/components/schemas/TestCampaignDTO"
    facebookCampaignStatus:
      type: "string"
      description: "Campaign status"
      enum:
      - "ACTIVE"
      - "PAUSED"
      - "DELETED"
      - "ARCHIVED"
      - "WITH_ISSUES"
      - "IN_PROCESS"
    ReportRecordSummary:
      type: "object"
      properties:
        record_values:
          type: "object"
          additionalProperties:
            type: "string"
          readOnly: true
      example:
        record_values:
          CampaignName:
          - group: "ATTRIBUTES"
            value: ""
          Clicks:
          - group: "PERFORMANCE"
            value: "15"
    facebookImpressionCaps:
      type: "object"
      properties:
        daily_impression_cap:
          type: "integer"
          description: "Daily impression cap"
        lifetime_impression_cap:
          type: "integer"
          description: "Lifetime impression cap"
      description: "Impression caps"
    facebookAdgroupType:
      type: "object"
      properties:
        promoted_object:
          $ref: "#/components/schemas/facebookPromotedObject"
        frequency_spec:
          $ref: "#/components/schemas/facebookFrequencySpec"
        attribution_spec:
          type: "array"
          description: "Attribution spec"
          items:
            $ref: "#/components/schemas/facebookAttributionSpec"
        conversion_location:
          type: "string"
          description: "Conversion location"
          enum:
          - "WEBSITE"
          - "APP"
          - "MESSENGER"
          - "APPLINKS_AUTOMATIC"
          - "WHATSAPP"
          - "SHOP_AUTOMATIC"
          - "UNDEFINED"
          - "INSTAGRAM_DIRECT"
          - "PHONE_CALL"
          - "MESSAGING_INSTAGRAM_DIRECT_MESSENGER"
          - "ON_AD"
          - "ON_POST"
          - "ON_VIDEO"
          - "ON_EVENT"
          - "ON_PAGE"
      description: "Adgroup type"
    asyncReportRequest:
      required:
      - "fields"
      - "require_yesterday_performance"
      - "template_name"
      type: "object"
      properties:
        template_name:
          $ref: "#/components/schemas/asyncReportTemplateName"
        start_date:
          type: "string"
          description: "The start date for your report data."
          format: "yyyy-MM-dd"
        end_date:
          type: "string"
          description: "The end date for your report data."
          format: "yyyy-MM-dd"
        currency:
          type: "string"
          description: "The currency for all monetary values in the report. In cross-profile\
            \ reports, use Profile Currency to get all monetary values in each row\
            \ presented in the currency of this row’s profile. Use any other currency\
            \ to get all data in the report in the same currency."
          example: "USD"
          default: "Profile Currency"
        channels:
          type: "array"
          description: "The channels to include data from in the report."
          example:
          - "Google"
          - "MSN"
          items:
            $ref: "#/components/schemas/asyncReportChannel"
          default:
          - "All Elements"
        custom_file_name:
          type: "string"
          description: "Enter any text and attribute (parameters) to include in the\
            \ filename of the generated reports."
        compress_method:
          type: "string"
          description: "How you want the file to be compressed."
          enum:
          - "ZIP"
          - "GZIP"
          default: "GZIP"
        delimiter:
          type: "string"
          description: "The character used to separate the values in the report."
          enum:
          - ","
          - "/"
          - "Tab"
          - "|"
          default: "Tab"
        require_yesterday_performance:
          type: "boolean"
          description: "Whether the report should only be sent once performance data\
            \ from the previous day is ready."
        include_revenue_columns:
          type: "boolean"
          description: "Whether the report includes a revenue column for each selected\
            \ conversion or conversion type column."
          default: false
        selected_profile_ids:
          type: "array"
          description: "The IDs of Skai profiles to include in the report. When this\
            \ parameter is not used, all profile IDs to which the user has access\
            \ are included in the report."
        entity_level:
          type: "string"
          description: "The entity level of the report. Relevant for Structure Data:\
            \ Dimensions report only."
          enum:
          - "Ad"
          - "Keyword"
          - "Ad Group"
          - "Campaign"
          - "Profile"
        dimensions:
          type: "string"
          description: "The dimensions to include in the report. Relevant for Structure\
            \ Data: Dimensions report only."
          default: "All Elements"
        fields:
          type: "array"
          description: "The fields to include in the report."
          items:
            $ref: "#/components/schemas/asyncReportField"
      description: "The properties for the report request"
      example:
        template_name: "Fusion: Ads"
        start_date: "2026-01-01"
        end_date: "2026-01-14"
        currency: "USD"
        channels:
        - "Google"
        fields:
        - name: "Clicks"
        custom_file_name: "Name test"
        compress_method: "ZIP"
        delimiter: "Tab"
        require_yesterday_performance: "true"
        include_revenue_columns: "false"
        selected_profile_ids:
        - 401
        - 402
    ReportResponseStructure:
      type: "object"
      properties:
        records:
          $ref: "#/components/schemas/ReportRecord"
        summary:
          $ref: "#/components/schemas/ReportRecordSummary"
        total:
          type: "integer"
          format: "int64"
          readOnly: true
    SummaryVO:
      type: "object"
      properties:
        name:
          type: "string"
          readOnly: true
        data:
          type: "array"
          readOnly: true
          items:
            type: "object"
            additionalProperties:
              type: "string"
    CampaignDTO:
      type: "object"
      properties:
        id:
          type: "integer"
          description: "Skai ID of the campaign"
        channel_campaign_id:
          type: "string"
          description: "Publisher ID of the campaign"
        channel_account_id:
          type: "integer"
          description: "Skai ID of the publisher account"
        profile_id:
          type: "integer"
          description: "Skai ID of the profile"
        channel_type:
          type: "string"
          description: "Campaign channel type"
          enum:
          - "Google"
          - "Microsoft"
          - "Universal"
          - "Yandex"
          - "Baidu"
          - "YahooJapan"
          - "YahooGemini"
          - "Pinterest"
          - "Amazon"
          - "Facebook"
          - "Walmart"
        campaign_name:
          type: "string"
          description: "Campaign name"
        budget:
          type: "number"
          description: "Campaign budget in the profile's currency"
        budget_type:
          type: "string"
          description: "Budget type"
          enum:
          - "DEFAULT"
          - "DAILY_FOR_ADGROUP"
          - "MONTHLY_FOR_CAMPAIGN"
          - "LIFETIME"
        search_bid:
          type: "number"
          description: "Default search bid in the profile's currency"
        content_bid:
          type: "number"
          description: "Default content bid in the profile's currency"
        status:
          type: "string"
          description: "Campaign status"
          enum:
          - "ACTIVE"
          - "PAUSED"
          - "DELETED"
          - "REVIEW"
          default: "ACTIVE"
        order_line:
          type: "string"
          description: "Order line of the campaign"
        start_date:
          type: "string"
          description: "Campaign start date"
          format: "yyyy-MM-dd"
        end_date:
          type: "string"
          description: "Campaign end date"
          format: "yyyy-MM-dd"
        tracking_level:
          type: "string"
          description: "Campaign tracking level"
          enum:
          - "NONE"
          - "PROFILE_DEFAULT"
          - "CAMPAIGN"
          - "ADS"
          - "KEYWORDS"
          - "ADS_AND_KEYWORDS"
          default: "PROFILE_DEFAULT"
        campaign_type:
          type: "string"
          description: "Campaign type"
          enum:
          - "TEXT_CAMPAIGN"
          - "SMART_SHOPPING"
          - "SHOPPING_STANDARD"
          default: "TEXT_CAMPAIGN"
        shopping_settings:
          $ref: "#/components/schemas/shoppingSettings"
    asyncReportStructureField:
      type: "string"
      description: "\n<style>\n  table th:first-of-type {width: 25%;}\n  table th:nth-of-type(2)\
        \ {width: 35%;}\n  table th:nth-of-type(3) {width: 5%;}\n  table th:nth-of-type(4)\
        \ {width: 35%;}\n</style>\n\n| Field name                      | Reports the\
        \ field is available in                                                  \
        \                                                                        \
        \                                                                        \
        \                            | Data type   | Description                 \
        \                                                                        \
        \                                                                        \
        \                                            |\n|---------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|-------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n\
        | `Profile Name`                  | Structure Data: Profiles<br>Structure\
        \ Data: Campaigns<br>Structure Data: Channels<br>Structure Data: Ad Groups<br>Structure\
        \ Data: Keywords<br>Structure Data: Ads<br>Structure Data: Product Groups<br>Structure\
        \ Data: Sitelinks                               | TEXT(50)    | Profile name\
        \ in Skai<br>Example: `ACME Brand`                                       \
        \                                                                        \
        \                                                         |\n| `Profile ID`\
        \                    | Structure Data: Profiles<br>Structure Data: Campaigns<br>Structure\
        \ Data: Channels<br>Structure Data: Ad Groups<br>Structure Data: Keywords<br>Structure\
        \ Data: Ads<br>Structure Data: Product Groups<br>Structure Data: Sitelinks<br>Structure\
        \ Data: Dimensions | INT         | Profile ID in Skai<br>Example: `102`  \
        \                                                                        \
        \                                                                        \
        \                               |\n| `Profile Currency`              | Structure\
        \ Data: Profiles<br>Structure Data: Campaigns<br>Structure Data: Channels<br>Structure\
        \ Data: Ad Groups<br>Structure Data: Keywords<br>Structure Data: Ads<br>Structure\
        \ Data: Product Groups                                                   \
        \         | TEXT(10)    | Currency in which all monetary values under this\
        \ profile will be stored in Skai. Any other currencies will be converted upon\
        \ processing.<br>Format: 3-character ISO 4217 currency code<br>Example: `USD`\
        \             |\n| `Time Zone`                     | Structure Data: Profiles\
        \                                                                        \
        \                                                                        \
        \                                                                        \
        \               | TEXT(50)    | Time zone for the profile<br>All data reported\
        \ for the profile will be displayed in this time zone.<br>Example: `US/Eastern`\
        \                                                                        \
        \                    |\n| `Profile Token`                 | Structure Data:\
        \ Profiles                                                               \
        \                                                                        \
        \                                                                        \
        \                        | TEXT(50)    | Unique value assigned to all Skai\
        \ profiles. Used in configuration of event tracking such as the Skai infinity\
        \ tag.<br>Example: `1acbf593-7551-4aea-83d0-711f4446320e`                \
        \                             |\n| `Create Date`                   | Structure\
        \ Data: Profiles                                                         \
        \                                                                        \
        \                                                                        \
        \                              | DATETIME    | Date and time the profile was\
        \ created<br>Format: `yyyy-MM-dd HH:mm:ss`<br>Example: `2026-01-01 00:00:00`\
        \                                                                        \
        \                                          |\n| `Last Modified`          \
        \       | Structure Data: Profiles<br>Structure Data: Campaigns<br>Structure\
        \ Data: Channels<br>Structure Data: Ad Groups<br>Structure Data: Keywords<br>Structure\
        \ Data: Product Groups<br>Structure Data: Dimensions                     \
        \                                | DATETIME    | Date and time the profile\
        \ was last modified<br>Format: `yyyy-MM-dd HH:mm:ss`<br>Example: `2026-01-01\
        \ 00:00:00`                                                              \
        \                                              |\n| `Status`             \
        \           | Structure Data: Campaigns<br>Structure Data: Channels<br>Structure\
        \ Data: Ad Groups<br>Structure Data: Keywords<br>Structure Data: Ads<br>Structure\
        \ Data: Product Groups                                                   \
        \                                     | TEXT(50)    | Status of the reported\
        \ entity<br>Valid values: `Active`, `Paused`, `Deleted`, `Pending`, `Inactive`,\
        \ `Disapproved`, `Approved`, `Failed`, `To Pause`, `To Delete`, `Failed to\
        \ Pause`, `Failed to Delete`                |\n| `Channel`               \
        \        | Structure Data: Campaigns<br>Structure Data: Channels<br>Structure\
        \ Data: Ad Groups<br>Structure Data: Keywords<br>Structure Data: Ads<br>Structure\
        \ Data: Product Groups<br>Structure Data: Sitelinks<br>Structure Data: Dimensions\
        \                             | TEXT(50)    | Name of the publisher<br>Example:\
        \ `Google`                                                               \
        \                                                                        \
        \                                       |\n| `Channel Account ID`        \
        \    | Structure Data: Campaigns<br>Structure Data: Channels<br>Structure\
        \ Data: Ad Groups<br>Structure Data: Keywords<br>Structure Data: Ads<br>Structure\
        \ Data: Sitelinks                                                        \
        \                                     | INT         | ID of this publisher\
        \ account, in Skai<br>Example: `408`                                     \
        \                                                                        \
        \                                                 |\n| `Unique Channel Account\
        \ ID`     | Structure Data: Campaigns<br>Structure Data: Ad Groups<br>Structure\
        \ Data: Sitelinks                                                        \
        \                                                                        \
        \                                            | BIGINT      | Unique ID of\
        \ this publisher account, in Skai. Will be identical for several instances\
        \ of the same account, across multiple profiles.<br>Example: `102`       \
        \                                                        |\n| `Channel Account\
        \ Publisher ID`  | Structure Data: Campaigns<br>Structure Data: Channels<br>Structure\
        \ Data: Ad Groups<br>Structure Data: Keywords<br>Structure Data: Ads<br>Structure\
        \ Data: Product Groups<br>Structure Data: Sitelinks<br>Structure Data: Dimensions\
        \                             | INT         | ID of this publisher account,\
        \ in the publisher<br>Example: `123456789`                               \
        \                                                                        \
        \                                           |\n| `Channel Type ID`       \
        \        | Structure Data: Channels                                      \
        \                                                                        \
        \                                                                        \
        \                                                 | INT         | Skai numeric\
        \ identifier for the name of the publisher:<br>1 - Google<br>2 - Bing (MSN)<br>3\
        \ - Yahoo<br>4 - Yandex<br>5 - Baidu<br>Example: `1`                     \
        \                                                  |\n| `Channel Currency`\
        \              | Structure Data: Channels                                \
        \                                                                        \
        \                                                                        \
        \                                                       | TEXT(10)    | Reported\
        \ currency from the publisher<br>Example: `USD`                          \
        \                                                                        \
        \                                                                |\n| `Account\
        \ Name`                  | Structure Data: Campaigns<br>Structure Data: Channels<br>Structure\
        \ Data: Ad Groups<br>Structure Data: Keywords<br>Structure Data: Ads     \
        \                                                                        \
        \                                             | TEXT(255)   | Name of the\
        \ account, if available, or the username configured in Skai to access the\
        \ account<br>Example: `Northwest_Google`                                 \
        \                                                          |\n| `Account Status`\
        \                | Structure Data: Campaigns<br>Structure Data: Ad Groups<br>Structure\
        \ Data: Keywords<br>Structure Data: Ads<br>Structure Data: Product Groups<br>Structure\
