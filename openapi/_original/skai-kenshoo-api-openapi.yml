        second_monitor_value:
          type: "number"
          description: "The second monitor metric's target value for the cycle"
        rollover:
          type: "number"
          description: "The amount of unspent budget from the previous cycle to add\
            \ to the current cycle's budget. Available only if Allow Cycle Budget\
            \ Rollover is set to TRUE"
        optimize_with_budget_caps:
          type: "boolean"
          description: "When set to TRUE, Skai automatically optimizes to spend your\
            \ budget for the cycle by updating the daily budget caps for your campaigns."
        optimize_with_keyword_bids:
          type: "boolean"
          description: "When set to TRUE, Skai automatically optimizes keyword-level\
            \ bids to maximize clicks while meeting the spend goal for the portfolio.\
            \ This process will run only if Optimize with Budget Caps is also set\
            \ to TRUE and a Max Effective Bid is specified."
        optimize_for:
          type: "string"
          description: "The goal the portfolio optimizes for"
          enum:
          - "CLICKS"
          - "CONVERSIONS"
          - "REVENUE"
          - "VISIBILITY"
        max_effective_bid:
          type: "number"
          description: "Upper bid limit for each keyword in the portfolio"
        bid_strategy_target:
          type: "number"
          description: "The publisher automated bid strategy target value"
        publisher_bid_strategy:
          type: "boolean"
          description: "Indicates if the portfolio uses publisher automated bidding"
        signal_enhancement:
          type: "array"
          description: "Defines whether the portfolio uses Signal Enhancement and\
            \ syncs conversions to Google, Microsoft, or none of the publishers. Send\
            \ an empty array to define as none."
          items:
            type: "string"
            enum:
            - "Google"
            - "Microsoft"
        budget_pacing:
          type: "string"
          description: "Defines budget pacing during a cycle. Available only if Optimize\
            \ with Budget Caps is set to TRUE."
          enum:
          - "pace evenly"
          - "pace early"
          - "pace late"
          default: "pace evenly"
        day_parting_monday:
          type: "string"
          description: "Defines whether campaigns included in the portfolio are active\
            \ or paused on Mondays"
          enum:
          - "true"
          - "false"
          default: "true"
        day_parting_tuesday:
          type: "string"
          description: "Defines whether campaigns included in the portfolio are active\
            \ or paused on Tuesdays"
          enum:
