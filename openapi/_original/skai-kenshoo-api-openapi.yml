        \ Channels<br>Fusion: Campaigns by Device<br>Fusion: Adgroups<br>Fusion: Ads<br>Fusion:\
        \ Ads by Device<br>Fusion: Keywords<br>Fusion: Keywords by Device<br>Fusion:\
        \ Keywords with Content and PLA<br>Fusion: Dynamic Ad Targets<br>Fusion: Product\
        \ Groups<br>Fusion: Sitelinks<br>Fusion: Audiences<br>Fusion: Audiences by\
        \ Device  | FLOAT(40,20) | Average number of conversions per click<br>Example:\
        \ `0.4`                                                                  \
        \                                                                        \
        \                     |\n| `Avg Pos`                         | Fusion: Profiles<br>Fusion:\
        \ Campaigns<br>Fusion: Channels<br>Fusion: Campaigns by Device<br>Fusion:\
        \ Adgroups<br>Fusion: Ads<br>Fusion: Ads by Device<br>Fusion: Keywords<br>Fusion:\
        \ Keywords by Device<br>Fusion: Keywords with Content and PLA<br>Fusion: Dynamic\
        \ Ad Targets<br>Fusion: Product Groups<br>Fusion: Sitelinks<br>Fusion: Audiences<br>Fusion:\
        \ Audiences by Device  | FLOAT(40,20) | Average position of the impression<br>Example:\
        \ `2.1`                                                                  \
        \                                                                        \
        \                          |\n| `Rev.`                            | Fusion:\
        \ Profiles<br>Fusion: Campaigns<br>Fusion: Channels<br>Fusion: Campaigns by\
