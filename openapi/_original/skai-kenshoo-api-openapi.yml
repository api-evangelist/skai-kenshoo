        \ to budget<br>Example: `34.5`                                           \
        \                                                                        \
        \                                               |\n| `Potential Impressions`\
        \           | Fusion: Adgroups<br>Fusion: Keywords<br>Fusion: Keywords by\
        \ Device                                                                 \
        \                                                                        \
        \                                                                        \
        \                                                                        \
