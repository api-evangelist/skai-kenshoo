          - "false"
          default: "true"
        allow_cycle_budget_rollover:
          type: "boolean"
          description: "Defines whether any remaining unspent budget is automatically\
            \ rolled over to the next cycle. Available only if Optimize with Budget\
            \ Caps is set to TRUE"
          default: false
        campaign_min_daily_budget:
          type: "number"
          description: "Set a minimum campaign daily budget for all campaigns within\
            \ this portfolio. Valid values for this setting may vary by publisher."
        campaign_max_daily_budget:
          type: "number"
          description: "Set a maximum campaign daily budget for all campaigns within\
            \ this portfolio. Valid values for this setting may vary by publisher."
        pause_campaign_setting:
          type: "boolean"
          description: "Defines whether campaigns in the portfolio will automatically\
            \ pause when budget issues are detected. Available only if there is no\
            \ campaign_min_daily_budget or campaign_max_daily_budget set for the portfolio."
          default: false
    AsyncAnalysis:
      required:
      - "date_range"
      - "entity"
      - "fields"
      type: "object"
      properties:
        entity:
          $ref: "#/components/schemas/ReportEntity"
        date_range:
          $ref: "#/components/schemas/DateRange"
        fields:
          uniqueItems: true
          type: "array"
          description: "The columns to be fetched. See [here](#operation/getAvailableColumns)\
            \ for available columns.\nTo get data segmented by date, add a date column,\
            \ like so: `{\"name\": \"Day\", \"group\": \"TimeSegment\"}`"
          items:
            $ref: "#/components/schemas/Column"
        filters:
          uniqueItems: true
          type: "array"
          items:
            $ref: "#/components/schemas/ReportFilter"
        sort:
          $ref: "#/components/schemas/ReportSort"
        info_level:
          type: "string"
          description: "Show summary records only, breakdown records only, or both."
          enum:
          - "SUMMARY"
          - "BREAKDOWN"
          - "BOTH"
          default: "BOTH"
        breakdown_type:
          type: "string"
          description: "To get data segmented only by date, use `GROUP`. To segment\
            \ by both date and another column, use `SEGMENT` with only the date column\
            \ in group_bys and include the other column in `fields` (these columns\
            \ will be fetched). Otherwise, use `FLAT`"
          enum:
          - "FLAT"
          - "GROUP"
          - "SEGMENT"
          default: "FLAT"
        group_bys:
          type: "Array"
          description: "When the breakdown type is \"GROUP\", select columns by which\
            \ to group the data. Often, this would be the date column (see example)\
            \ and the ID of the entity you are pulling."
        profile_token:
          type: "string"
          description: "Profile token. Either profile token or profile ID is needed\
            \ to access [Single-Profile columns](#operation/getAvailableColumns) (alternative\
            \ to profile_id)."
        profile_id:
          type: "number"
          description: "Profile ID. Either profile token or profile ID is needed to\
            \ access [Single-Profile columns](#operation/getAvailableColumns) (alternative\
            \ to profile_token)."
        custom_file_name:
          type: "string"
          description: "Enter any text and attribute (parameters) to include in the\
            \ filename of the generated reports."
        compress_method:
          type: "string"
          description: "How you want the file to be compressed."
          enum:
          - "ZIP"
          - "GZIP"
          default: "GZIP"
        skip_zero_performance_rows:
          type: "boolean"
          description: "When set to true, the report includes only rows with performance\
            \ data greater than 0. When set to false, all rows will be returned, even\
            \ if there is no performance data. Relevant grids - `CAMPAIGN`, `ADGROUP`,\
            \ `AD`, `KEYWORD`. This parameter has no effect on other grids."
          default: false
      description: "The properties for the async analysis request"
      example:
        entity: "CAMPAIGN"
        profile_id: 118
        date_range:
          start_date: "2026-01-01"
          end_date: "2026-01-14"
        info_level: "BREAKDOWN"
        fields:
        - name: "CampaignName"
          group: "ATTRIBUTES"
        - name: "Clicks"
          group: "PERFORMANCE"
        - name: "Day"
          group: "TimeSegment"
        filters:
        - field: "StatusToDisplay"
          group: "ATTRIBUTES"
          operator: "In"
          values:
          - "Approved"
          - "Active"
        - field: "CampaignName"
          group: "ATTRIBUTES"
          operator: "CONTAINS"
          values:
          - "My"
        - field: "Impressions"
          group: "PERFORMANCE"
          operator: "GREATER_THAN"
          values:
          - "0"
        sort:
          field: "CampaignName"
          group: "ATTRIBUTES"
          order: "DESCENDING"
        breakdown_type: "GROUP"
        group_bys:
        - name: "Day"
          group: "TimeSegment"
        customFileName: "my_report"
        compressMethod: "ZIP"
        skip_zero_performance_rows: true
