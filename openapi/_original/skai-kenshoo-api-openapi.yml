        \ Max. CPC | MONETARY | The bid set to express the highest amount you are\
        \ willing to pay for an ad click. |\n| `BidStrategyTarget` | Bid Strategy\
        \ Target | STRING | The value for your publisher-optimized campaigns. |\n\
        | `Brand entity ID` | Brand entity ID | STRING | The brand ID that the campaign\
        \ is associated with. Required for sellers creating Sponsored Brands campaigns\
