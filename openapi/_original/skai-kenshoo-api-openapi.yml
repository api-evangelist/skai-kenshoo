  /api/v1/reports/async/{execution_id}/status:
    get:
      tags:
      - "Asynchronous Reports"
      summary: "Poll report execution status"
      description: "After calling the API to trigger a report, the Skai query will\
        \ begin processing. The runtime may vary between a few seconds and an hour,\
        \ depending on the scope of the report and the amount of data returned.\n\n\
        This API call is designed to be run at recurring polling intervals so that\
        \ you can inquire from the Skai API when the report is ready. A best practice\
        \ would be to run the report manually a few times to figure out the average\
        \ run time before deciding on the polling interval you will use.\n\nFor reports\
        \ that take an average of a few seconds, we recommend using a series of intervals\
        \ such as 10s, 30s, or 60s. For reports that take an average of a number of\
        \ minutes or more, we recommend using a series of intervals such as 10m, 20m,\
        \ or 30m."
      operationId: "getAsyncReportStatus"
      parameters:
      - $ref: "#/components/parameters/ks"
      - name: "execution_id"
        in: "path"
        description: "The execution id received in response to the 'Run a Report'\
          \ API call."
        required: true
        style: "simple"
        explode: false
        schema:
          type: "string"
      responses:
        200:
          description: "Report execution triggered successfully"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  status:
                    type: "string"
                    description: "Status description:\n * `COMPLETED` - Your report\
                      \ is ready to download.\n * `COMPLETED_WITH_ERRORS` - The report\
                      \ run was completed but there were some errors during report\
                      \ generation. If this issue persists, please contact Skai support.\n\
                      \ * `PARTIALLY_COMPLETED` - Some data may be missing from the\
                      \ report. If this issue persists, please contact Skai support.\n\
                      \ * `FAILED` - Skai could not run this report. If this issue\
                      \ persists, please contact Skai support.\n * `ABORTED` - Skai\
                      \ had to abort this report run. If this issue persists, please\
                      \ contact Skai support.\n * `FAILED_DATA_NOT_READY` - The data\
                      \ for the requested dates is not yet ready in Skai (this data\
                      \ is pulled into Skai from the publishers and from external\
                      \ vendors). Abort the flow and try again in an hour.\n"
                    enum:
                    - "COMPLETED"
                    - "COMPLETED_WITH_ERRORS"
                    - "PARTIALLY_COMPLETED"
                    - "FAILED"
                    - "ABORTED"
                    - "FAILED_DATA_NOT_READY"
                example:
                  status: "COMPLETED"
        400:
          description: "Invalid request"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  errorMessage:
                    type: "string"
                  errorCode:
                    type: "string"
                example:
                  errorCode: "SCHREP-04"
                  errorMessage: "No execution found with execution id rxp-12345"
        500:
          description: "Server error"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  errorMessage:
                    type: "string"
  /api/v1/external-reports:
    get:
      tags:
      - "External Reports"
      summary: "Get External Score Providers"
      description: "Two variants depending on parameters provided:\n- `profileId`\
        \ only → lists all ESPs for the profile (`GET /api/v1/external-reports/{profileId}`)\n\
        - `profileId` + `espId` → returns full config for one ESP (`GET /api/v1/external-reports/config/{profileId}/{espId}`)\n\
        \nPass `espId = -1` to retrieve a blank default config (useful as a template\
        \ when creating a new provider)."
      operationId: "getExternalReports"
      parameters:
      - $ref: "#/components/parameters/ks"
      - name: "profileId"
        in: "query"
        description: "Profile ID to retrieve providers for"
        required: true
        style: "form"
        explode: true
        schema:
          type: "integer"
        example: 123
      - name: "espId"
        in: "query"
        description: "ESP ID to retrieve full config for. Pass -1 to get a blank default\
          \ config."
        required: false
        style: "form"
        explode: true
        schema:
          type: "integer"
        example: 9
      responses:
        200:
          description: "List of ESPs or full ESP config object"
          content:
            application/json:
              schema:
                oneOf:
                - type: "array"
                  items:
                    $ref: "#/components/schemas/EspSummary"
                - $ref: "#/components/schemas/EspConfig"
              examples:
                list:
                  summary: "List response"
                  value:
                  - id: 9
                    name: "My FTP Report"
                    status: "Active"
                  - id: 14
                    name: "Salesforce Report"
                    status: "Paused"
        404:
          description: "Profile or provider not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
      - "External Reports"
      summary: "Update an existing ESP provider"
      description: "Replaces the full configuration of an existing ESP (`PUT /api/v1/external-reports/config/{profileId}/{espId}`).\n\
        Provider name cannot be changed after creation. Send the complete config object\
        \ — partial updates not supported (use PATCH for that).\n\n**Note:** GCS protocol\
        \ is not supported."
      operationId: "updateExternalReport"
      parameters:
      - $ref: "#/components/parameters/ks"
      - name: "profileId"
        in: "query"
        description: "Profile ID the provider belongs to"
        required: true
        style: "form"
        explode: true
        schema:
          type: "integer"
        example: 123
      - name: "espId"
        in: "query"
        description: "ID of the ESP to update"
        required: true
        style: "form"
        explode: true
        schema:
          type: "integer"
        example: 9
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EspConfig"
        required: true
      responses:
        200:
          description: "Updated ESP configuration"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EspConfig"
        400:
          description: "Validation failed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        404:
          description: "Provider not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
      - "External Reports"
      summary: "Create a new ESP provider"
      description: "Creates a new External Score Provider under the given profile\
        \ (`POST /api/v1/external-reports/config/{profileId}`).\nSend the full configuration\
        \ in the request body. Use `GET` with `espId = -1` to get a blank config as\
        \ a starting point.\n\n**Note:** GCS (Google Cloud Storage) protocol is not\
        \ supported. Use the UI or multipart endpoint for GCS providers."
      operationId: "createExternalReport"
      parameters:
      - $ref: "#/components/parameters/ks"
      - name: "profileId"
        in: "query"
        description: "Profile ID to create the provider under"
        required: true
        style: "form"
        explode: true
        schema:
          type: "integer"
        example: 123
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EspConfig"
        required: true
      responses:
        200:
          description: "Provider created — returns new provider ID"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  id:
                    type: "integer"
                    description: "ID of the newly created provider"
              example:
                id: 42
        400:
          description: "Validation failed (e.g. duplicate name, GCS protocol used)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: "Server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
      - "External Reports"
      summary: "Delete an ESP provider"
      description: "Permanently deletes an External Score Provider (`DELETE /api/v1/external-reports/{profileId}/{espId}`)."
      operationId: "deleteExternalReport"
      parameters:
      - $ref: "#/components/parameters/ks"
      - name: "profileId"
        in: "query"
        description: "Profile ID the provider belongs to"
        required: true
        style: "form"
        explode: true
        schema:
          type: "integer"
        example: 123
      - name: "espId"
        in: "query"
        description: "ID of the ESP to delete"
        required: true
        style: "form"
        explode: true
        schema:
          type: "integer"
        example: 9
      responses:
        204:
          description: "Provider deleted successfully"
        404:
          description: "Provider not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
