  /api/v1/reports/{entity}/available_columns:
    get:
      tags:
      - "Available Columns"
      summary: "Get available columns"
      description: "Get available columns for all Analysis Grid reports. Relevant\
        \ to [synchronous reports](#operation/fetchReport) and [asynchronous analysis\
        \ grid reports](#operation/asyncAnalysisReport)\n\n#### Cross-Profile vs Single-Profile\n\
        Some columns groups in Skai available across all profiles, including in views\
        \ where no specific profile is requested (Cross-Profile). Others column groups\
        \ are defined within a profile (even when many profiles have identical definitions),\
        \ and can only be pulled in single-profile requests (Single-Profile).\n\n\
        #### report_supported field:\nShows whether the column is supported for reporting.\
        \ `true` → Supported and can be included in reports. `false` → Not supported\
        \ for reporting.\n\n#### Understanding the returned column groups:\n| Column\
        \ Group in the API         | Availability                      | Group Name\
        \ in Skai Column Selection UI  | Description                             \
        \                                                                        \
        \                    |\n|---------------------------------|-----------------------------------|-----------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------|\n\
        | Attributes                      | Cross-Profile and Single-Profile  | Attributes\
        \                              | Attributes of your campaigns, native to Skai\
        \                                                                        \
        \                |\n| Performance                     | Cross-Profile and\
        \ Single-Profile  | Performance                             | Performance\
        \ metrics native to Skai                                                 \
        \                                                 |\n| AttributionForecasting\
        \          | Cross-Profile and Single-Profile  | Attribution Forecasting \
        \                | Skai's forecasted metrics                             \
        \                                                                        \
        \      |\n| CustomMetricsPlus               | Cross-Profile and Single-Profile\
        \  | Custom metrics+                         | Organization level formula\
        \ based columns, defined by users in your organization. Editable under _Dimensions\
        \ & Categories_           |\n| Dimensions                      | Cross-Profile\
        \ and Single-Profile  | Dimensions                              | Organization\
        \ level labeling column, defined by users in your organization. Editable under\
        \ _Settings_ -> _Custom metrics & columns_  |\n| SmartTags               \
        \        | Cross-Profile and Single-Profile  | Smart tags                \
        \              | Skai AI-powered insights                                \
        \                                                                        \
        \    |\n| ChannelCustomerConversionTypes  | Cross-Profile and Single-Profile\
        \  | Publisher report conversions            | Conversions and revenue from\
        \ publisher APIs. Names editable under _Settings_ -> _Conversions_       \
        \                                |\n| ExternalCustomerConversionTypes | Cross-Profile\
        \ and Single-Profile  | External report conversion              | Conversions\
        \ and revenue from Files and Integrations. Names editable under _Settings_\
        \ -> _Conversions_                               |\n| ProxyCustomerConversionTypes\
        \    | Cross-Profile and Single-Profile  | Skai pixel conversion         \
        \          | Conversions and revenue from Skai's Pixel. Names editable under\
        \ _Settings_ -> _Conversions_                                         |\n\
        | Custom Solutions                | Cross-Profile and Single-Profile  | Custom\
        \ Solutions                        | Columns powered by Skai Labs' custom\
        \ solutions                                                              \
        \                        |\n| ConversionTypes                 | Single-Profile\
        \                    | Conversion Columns                      | Conversion\
        \ Columns set up per profile, often publisher specific. Editable under _Settings_\
        \ -> _Conversion columns_ within a profile |\n| CustomMetrics            \
        \       | Single-Profile                    | Custom metrics (legacy)    \
        \             | Legacy formula based columns, defined by users in your organization.\
        \ Editable under _Profile settings_ -> _Custom Metrics (legacy)_ |\n\n<div\
        \ style=\"background:#e3f2fd;border-left:4px solid #1976d2;padding:12px 16px;margin:12px\
        \ 0;border-radius:0 4px 4px 0;\">\n<strong>This is a partial list of commonly\
        \ used columns.</strong> Skai supports hundreds of additional account-configured\
        \ columns:\n<strong>Dimensions</strong> — custom tagging labels you define\
        \ and apply to campaigns, ad groups, and keywords;\n<strong>Conversion events</strong>\
        \ — tracked by publishers, Skai pixel, and 3rd-party integrations, each appearing\
        \ as a count and a revenue column;\n<strong>Custom Metrics</strong> — formula-based\
        \ calculations your team creates (e.g. ROAS, CPA targets);\nand more.\n\n\
        Call this endpoint authenticated to see your <strong>full account-specific\
        \ column set</strong>.\n</div>\n\n#### Column Reference\n\n> **Column name**\
        \ is what to put in your API request. **Display name** is what users see in\
        \ the Skai UI.\n\n> **Types at a glance:** `STRING` = text · `INTEGER`/`FLOAT`/`BIG_INTEGER`\
        \ = number · `MONETARY`/`NULLABLE_MONETARY` = currency (profile currency)\
        \ · `PERCENT` = percentage · `BOOLEAN_DISPLAY` = Yes/No · `DATE`/`SERVER_DATE`\
        \ = date or datetime · `INTEGER_ID` = numeric identifier · Other types are\
        \ Skai-specific display formats (value is string or number depending on context).\n\
        \n\n##### CAMPAIGN\n\n**Performance** (21 standard columns)\n\n| Column name\
        \ | Display name | Type | Description |\n|---|---|---|---|\n| `AverageCPC`\
        \ | Avg. CPC | MONETARY | The average cost per click expressed as the number\
        \ of clicks divided by cost. |\n| `AveragePosition` | Avg. Pos. | FLOAT |\
        \ Avg. Pos. |\n| `CPM` | CPM | MONETARY | CPM |\n| `CTR` | CTR | PERCENT |\
        \ The click-through rate, expressed as the number of clicks on the ad divided\
        \ by the times it was shown. |\n| `Clicks` | Clicks | INTEGER | The number\
        \ of clicks reported by the publisher. |\n| `Conversion` | Conv. | FLOAT |\
        \ An aggregation of all conversion actions coming from publishers, Skai pixel,\
        \ and 3rd-party integration, or from actions you select. |\n| `ConversionRate`\
        \ | Conv. Rate | PERCENT | The conversion rate, expressed as the number of\
        \ conversions divided by the number of clicks. |\n| `Cost` | Cost | MONETARY\
        \ | The publisher cost, in the currency of the Skai profile. |\n| `CostConversion`\
        \ | Cost/Conv. | MONETARY | The cost of each conversion, expressed as cost\
        \ divided by the number of conversions. |\n| `Engagement` | Engagement | INTEGER\
        \ | The number of user engagements with your ads. |\n| `Impressions` | Imp.\
        \ | INTEGER | The number of impressions reported by the publisher. |\n| `ImprAbsTop`\
        \ | Impr. (Abs.Top) % | PERCENT | The percentage of ad impressions that are\
        \ shown as the very first ad above the organic search results |\n| `ImprTop`\
        \ | Impr. (Top) % | PERCENT | The percentage of ad impressions that are shown\
        \ anywhere above the organic search results. |\n| `ImpressionShare` | Impression\
        \ Share (IS) | PERCENT | The percentage of ad impressions you've received\
        \ divided by the estimated number of impressions you were eligible to receive.\
