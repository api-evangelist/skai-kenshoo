        \                                                                        \
        \                                           |\n| `Campaign Name`         \
        \        | Structure Data: Campaigns<br>Structure Data: Ad Groups<br>Structure\
        \ Data: Keywords<br>Structure Data: Ads<br>Structure Data: Product Groups<br>Structure\
        \ Data: Sitelinks                                                        \
        \                               | TEXT(255)   | Campaign name in Skai<br>Example:\
        \ `ACME Brand Clothing`                                                  \
        \                                                                        \
        \                                    |\n| `Campaign ID`                  \
        \ | Structure Data: Campaigns<br>Structure Data: Ad Groups<br>Structure Data:\
        \ Keywords<br>Structure Data: Ads<br>Structure Data: Product Groups<br>Structure\
