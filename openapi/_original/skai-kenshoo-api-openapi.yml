    ReportFilter:
      required:
      - "field"
      - "operator"
      - "values"
      type: "object"
      properties:
        field:
          type: "string"
          description: "Field name to be fetched"
        operator:
          type: "string"
          enum:
          - "EQUALS"
          - "NOT_EQUALS"
          - "IN"
          - "NOT_IN"
          - "GREATER_THAN"
          - "GREATER_THAN_EQUALS"
          - "LESS_THAN"
          - "LESS_THAN_EQUALS"
          - "STARTS_WITH"
          - "CONTAINS"
          - "DOES_NOT_CONTAIN"
          - "CONTAINS_ANY"
          - "CONTAINS_NONE"
          - "ENDS_WITH"
          - "IS_EMPTY"
          - "IS_NOT_EMPTY"
          - "BETWEEN"
        values:
          type: "array"
          items:
            type: "string"
        group:
          type: "string"
          description: "Each column belongs to a group. This list is partial - your\
            \ account may have additional column groups. Group names are available\
            \ in the getAvailableColumns endpoint"
          enum:
          - "ATTRIBUTES"
          - "PERFORMANCE"
          - "DIMENSIONS"
          - "CUSTOM_METRICS"
          - "CUSTOM_METRICS_PLUS"
          - "CONVERSION_TYPES"
          - "CHANNEL_CUSTOMER_CONVERSION_TYPES"
          - "PROXY_CUSTOMER_CONVERSION_TYPES"
          - "EXTERNAL_CUSTOMER_CONVERSION_TYPES"
      description: "Name of the field to which the condition will apply with certain\
        \ values."
      example:
      - field: "StatusToDisplay"
        group: "ATTRIBUTES"
        operator: "In"
        values:
        - "Approved"
        - "Active"
      - field: "CampaignName"
        group: "ATTRIBUTES"
        operator: "CONTAINS"
        values:
        - "New"
      - field: "Impressions"
        group: "PERFORMANCE"
        operator: "GREATER_THAN"
        values:
        - "0"
