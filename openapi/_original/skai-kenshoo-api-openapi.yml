        \ of impressions lost due to budget constraints. |\n| `LostImpressionShareRank`\
        \ | Lost IS (Rank) | PERCENT | The percentage of Impressions lost due to rank\
        \ constraints. |\n| `PostImpression` | Post Imps. Conv. | FLOAT | The number\
        \ of impressions of your ads that led to a conversion. |\n| `Profit` | Profit\
        \ | MONETARY | Profit = revenue - cost |\n| `ROI` | ROI | FLOAT | Return on\
        \ investment. The formula is: ROI = revenue / cost |\n| `Revenue` | Rev. |\
        \ MONETARY | An aggregation of all monetary value of conversion actions, coming\
        \ from publishers, Skai's pixel, and 3rd-party integration. |\n| `RevConversion`\
        \ | Rev./Conv. | MONETARY | The revenue amount divided by the number of conversions.\
        \ |\n\n**Attributes** (61 columns)\n\n| Column name | Display name | Type\
        \ | Description |\n|---|---|---|---|\n| `AI Max` | AI Max | STRING | Shows\
        \ whether AI Max is enabled for this Google Search campaign. |\n| `AccountName`\
        \ | Account Name | STRING | Name of the account, if available, or the username\
        \ configured in Skai to access the account |\n| `BidStrategyAdLocation` |\
        \ Bid Strategy Ad Location | STRING | The customer locations for which you\
