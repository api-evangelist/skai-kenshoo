        \ name | STRING | The brand name that the campaign is associated with. Required\
        \ for sellers creating Sponsored Brands campaigns when the brand entity ID\
        \ is empty. |\n| `BudgetType` | Budget Type | STRING | Budget Type for this\
        \ campaign |\n| `BidStrategy` | Campaign Bid Strategy | STRING | The bid strategy\
        \ for the campaign. |\n| `Campaign End Date` | Campaign End Date | DATE |\
        \ The date the campaign is scheduled to stop running. |\n| `CampaignType`\
