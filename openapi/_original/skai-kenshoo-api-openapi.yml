        \ ID | INTEGER | The campaign ID in Skai. |\n| `CampaignName` | Campaign Name\
        \ | STRING | The campaign name in Skai. |\n| `CampaignOrderLine` | Campaign\
        \ Order Line | STRING | The ID of the order line used in the Pinterest campaign.\
        \ |\n| `Campaign Priority` | Campaign Priority | STRING | The campaign selected\
        \ to serve ads for the product when there are multiple campaigns that advertise\
