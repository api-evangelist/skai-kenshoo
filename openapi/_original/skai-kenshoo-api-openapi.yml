    asyncReportTrackingField:
      type: "string"
      description: "\n<style>\n  table th:first-of-type {width: 25%;}\n  table th:nth-of-type(2)\
        \ {width: 35%;}\n  table th:nth-of-type(3) {width: 5%;}\n  table th:nth-of-type(4)\
        \ {width: 35%;}\n</style>\n\n| Field name              | Reports the field\
        \ is available in                                                        \
        \                                 | Data type    | Description           \
        \                                                                        \
        \                                                                        \
        \                           |\n|-------------------------|---------------------------------------------------------------------------------------------------------------------------|--------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n\
        | `Event_Time`            | Tracking Raw Data - Click Tracking Data<br>Tracking\
        \ Raw Data - Flat P2C                                                   |\
        \ DATETIME     | Time of the tracked event, in the time zone of the profile<br>Format:\
        \ `yyyy-MM-dd HH:mm:ss`<br>Example: `2026-01-01 00:00:00`                \
        \                                                      |\n| `Date`       \
        \           | Tracking Raw Data - Keywords Daily Performance             \
        \                                                               | DATE   \
        \      | Date of the event that created performance data<br>Format: `yyyy-MM-dd`<br>Example:\
        \ `2026-01-01`                                                           \
        \                                        |\n| `User_ID`               | Tracking\
        \ Raw Data - Click Tracking Data<br>Tracking Raw Data - Flat P2C         \
        \                                          | TEXT(100)    | A unique ID given\
        \ to the user who clicked the ad<br>Example: `47e36981-ec4f-44c7-9304-4ed30dbedbd7`\
        \                                                                        \
        \                      |\n| `Profile`               | Tracking Raw Data -\
        \ Click Tracking Data<br>Tracking Raw Data - Keywords Daily Performance<br>Tracking\
        \ Raw Data - Flat P2C | TEXT(50)     | Profile name in Skai<br>Example: `ACME\
        \ Brand`                                                                 \
        \                                                                        \
        \        |\n| `Profile_ID`            | Tracking Raw Data - Click Tracking\
        \ Data<br>Tracking Raw Data - Keywords Daily Performance<br>Tracking Raw Data\
        \ - Flat P2C | INT          | Profile ID in Skai<br>Example: `102`       \
        \                                                                        \
        \                                                                        \
        \   |\n| `Channel`               | Tracking Raw Data - Click Tracking Data<br>Tracking\
        \ Raw Data - Keywords Daily Performance<br>Tracking Raw Data - Flat P2C |\
        \ TEXT(50)     | Name of the publisher<br>Example: `Google`              \
        \                                                                        \
        \                                                                 |\n| `Campaign`\
        \              | Tracking Raw Data - Click Tracking Data<br>Tracking Raw Data\
        \ - Keywords Daily Performance<br>Tracking Raw Data - Flat P2C | TEXT(255)\
        \    | Campaign name in Skai<br>Example: `ACME Brand Clothing`           \
        \                                                                        \
        \                                                    |\n| `Campaign_ID`  \
        \         | Tracking Raw Data - Click Tracking Data<br>Tracking Raw Data -\
        \ Keywords Daily Performance                                 | BIGINT    \
        \   | Campaign ID in Skai<br>Example: `1123`                             \
        \                                                                        \
        \                                                   |\n| `Campaign ID KS Unique`\
        \ | Tracking Raw Data - Flat P2C                                         \
        \                                                     | BIGINT       | Campaign\
        \ ID in Skai<br>Example: `1123`                                          \
        \                                                                        \
        \                                      |\n| `Campaign_ID_In_Target` | Tracking\
        \ Raw Data - Flat P2C                                                    \
        \                                          | BIGINT       | Campaign ID in\
        \ the publisher<br>Example: `121270991`                                  \
        \                                                                        \
        \                                   |\n| `Ad_Group`              | Tracking\
        \ Raw Data - Click Tracking Data<br>Tracking Raw Data - Keywords Daily Performance<br>Tracking\
        \ Raw Data - Flat P2C | TEXT(256)    | Name of the ad group<br>Example: `Northwest\
        \ Region Trucks`                                                         \
        \                                                                        \
        \      |\n| `Adgroup_ID`            | Tracking Raw Data - Click Tracking Data<br>Tracking\
        \ Raw Data - Keywords Daily Performance                                 |\
        \ BIGINT       | Ad group ID in Skai<br>Example: `2124`                  \
        \                                                                        \
        \                                                              |\n| `Ad Group\
        \ ID KS Unique` | Tracking Raw Data - Flat P2C                           \
        \                                                                   | BIGINT\
        \       | Ad group ID in Skai<br>Example: `2124`                         \
        \                                                                        \
        \                                                       |\n| `Ad_Group_ID_In_Target`\
        \ | Tracking Raw Data - Flat P2C                                         \
        \                                                     | BIGINT       | Ad\
        \ group ID in the publisher<br>Example: `15782818485`                    \
        \                                                                        \
        \                                               |\n| `Keyword`           \
        \    | Tracking Raw Data - Click Tracking Data<br>Tracking Raw Data - Keywords\
        \ Daily Performance<br>Tracking Raw Data - Flat P2C | TEXT(4096)   | Keyword\
        \ text<br>Example: `Small Hybrid Cars`                                   \
        \                                                                        \
        \                                          |\n| `Keyword_ID`            |\
        \ Tracking Raw Data - Click Tracking Data<br>Tracking Raw Data - Keywords\
        \ Daily Performance                                 | BIGINT       | Tracking\
        \ ID of the keyword in Skai<br>Example: `1123`                           \
        \                                                                        \
        \                                      |\n| `Keyword ID KS Unique`  | Tracking\
        \ Raw Data - Flat P2C                                                    \
        \                                          | BIGINT       | Keyword ID in\
        \ Skai<br>Example: `1234`                                                \
        \                                                                        \
        \                                 |\n| `KW_Tracking_ID`        | Tracking\
        \ Raw Data - Flat P2C                                                    \
        \                                          | BIGINT       | Tracking ID of\
        \ the keyword in Skai<br>Example: `1123`                                 \
        \                                                                        \
        \                                |\n| `Match_Type`            | Tracking Raw\
        \ Data - Click Tracking Data<br>Tracking Raw Data - Keywords Daily Performance<br>Tracking\
        \ Raw Data - Flat P2C | TEXT(50)     | Match type of the keyword<br>Valid\
        \ values: `Exact`, `Phrase`, `Broad`                                     \
        \                                                                        \
        \               |\n| `Bid`                   | Tracking Raw Data - Keywords\
        \ Daily Performance                                                      \
        \                      | FLOAT(20,8)  | Bid of the tracked entity, in the\
        \ currency of the profile<br>Example: `1.50`                             \
        \                                                                        \
        \                |\n| `Ad_ID`                 | Tracking Raw Data - Click\
        \ Tracking Data                                                          \
        \                         | BIGINT       | Tracking ID of the ad in Skai<br>Example:\
        \ `1123`                                                                 \
        \                                                                        \
        \     |\n| `Ad ID KS Unique`       | Tracking Raw Data - Flat P2C        \
        \                                                                        \
        \              | BIGINT       | Ad ID in Skai<br>Example: `2124`         \
        \                                                                        \
        \                                                                        \
        \     |\n| `Ad_ID_In_Target`       | Tracking Raw Data - Flat P2C        \
        \                                                                        \
        \              | BIGINT       | Ad ID in the publisher<br>Example: `121270991`\
        \                                                                        \
        \                                                                        \
        \   |\n| `Ad_Tracking_ID`        | Tracking Raw Data - Flat P2C          \
        \                                                                        \
        \            | BIGINT       | Tracking ID of the ad in Skai<br>Example: `1123`\
        \                                                                        \
        \                                                                      |\n\
        | `Ad_Headline`           | Tracking Raw Data - Click Tracking Data<br>Tracking\
        \ Raw Data - Flat P2C                                                   |\
        \ TEXT(255)    | Headline of the ad<br>Example: `Chicago Cars 2016`      \
        \                                                                        \
        \                                                                 |\n| `Product\
        \ Group ID`      | Tracking Raw Data - Flat P2C                          \
        \                                                                    | BIGINT\
        \       | ID of the product group<br>Example: `1234`                     \
        \                                                                        \
        \                                                          |\n| `Conv_ID`\
        \               | Tracking Raw Data - Flat P2C                           \
        \                                                                   | BIGINT\
        \       | Unique identifier for a conversion. Can be used to connect clicks\
        \ and other conversions from a single path, to the conversion at the end of\
        \ the path.<br>Example: `12345`                        |\n| `Event_Type` \
        \           | Tracking Raw Data - Flat P2C                               \
        \                                                               | TEXT(100)\
        \    | Type of tracking event<br>Example: `Click`                        \
        \                                                                        \
        \                                                       |\n| `Order_ID`  \
        \            | Tracking Raw Data - Flat P2C                              \
        \                                                                | TEXT(3000)\
        \   | Order ID of the conversoin, if sent<br>Example: `2384hr83y487ty354`\
        \                                                                        \
        \                                                      |\n| `Promo_Code` \
        \           | Tracking Raw Data - Flat P2C                               \
        \                                                               | TEXT(3000)\
        \   | Promo code sent with the conversion. Used as a free text field.<br>Example:\
        \ `fff--0212-shopping-cart`                                              \
        \                                              |\n| `Assigned_Weight`    \
        \   | Tracking Raw Data - Flat P2C                                       \
        \                                                       | FLOAT(20,8)  | The\
        \ relative weight (out of 1) given to a click in a path leading to a conversion<br>Example:\
        \ `0.5`                                                                  \
        \                            |\n| `Path_Duration`         | Tracking Raw Data\
        \ - Flat P2C                                                             \
        \                                 | Duration     | Total time from the first\
        \ click in the path to the conversion<br>Example: `04:23:11`             \
        \                                                                        \
        \                        |\n| `Number_of_Clicks`      | Tracking Raw Data\
        \ - Flat P2C                                                             \
        \                                 | INT          | Total number of clicks\
        \ in the path leading to a conversion<br>Example: `4`                    \
        \                                                                        \
        \                           |\n| `Number_of_Channels`    | Tracking Raw Data\
        \ - Flat P2C                                                             \
        \                                 | INT          | Number of different publishers\
        \ with clicks participating in the path to a conversion<br>Example: `2`  \
        \                                                                        \
        \                   |\n| `Country`               | Tracking Raw Data - Click\
        \ Tracking Data<br>Tracking Raw Data - Flat P2C                          \
        \                         | TEXT(100)    | Country (by IP) of the tracking\
        \ event<br>Example: `US`                                                 \
        \                                                                        \
        \                  |\n| `City`                  | Tracking Raw Data - Click\
        \ Tracking Data<br>Tracking Raw Data - Flat P2C                          \
        \                         | TEXT(100)    | City (by IP) of the tracking event<br>Example:\
        \ `New York`                                                             \
        \                                                                        \
        \   |\n| `State`                 | Tracking Raw Data - Click Tracking Data<br>Tracking\
        \ Raw Data - Flat P2C                                                   |\
        \ TEXT(100)    | State (by IP) of the tracking event<br>Example: `NY`    \
        \                                                                        \
        \                                                                 |\n| `IP`\
        \                    | Tracking Raw Data - Click Tracking Data<br>Tracking\
        \ Raw Data - Flat P2C                                                   |\
        \ TEXT(100)    | IP address of the user who clicked the ad, with the last\
        \ octet redacted to 00<br>Example: `207.242.48.00 `                      \
        \                                                                 |\n| `Browser`\
        \               | Tracking Raw Data - Click Tracking Data<br>Tracking Raw\
        \ Data - Flat P2C                                                   | TEXT(100)\
        \    | Browser used by the user who clicked the ad<br>Example: `Chrome 11`\
        \                                                                        \
        \                                                      |\n| `Language`   \
        \           | Tracking Raw Data - Click Tracking Data<br>Tracking Raw Data\
        \ - Flat P2C                                                   | TEXT(100)\
        \    | Browser language used by the user who clicked the ad<br>Example: `Spanish\
        \ `                                                                      \
        \                                                |\n| `Revenue`          \
        \     | Tracking Raw Data - Keywords Daily Performance<br>Tracking Raw Data\
        \ - Flat P2C                                            | FLOAT(40,20) | Total\
        \ revenue, in the currency of the profile. Contains revenue from all “aggregated\
        \ to conv total” conversion columns.<br>Example: `23.34`                 \
        \                                     |\n| `Cost`                  | Tracking\
        \ Raw Data - Keywords Daily Performance<br>Tracking Raw Data - Flat P2C  \
        \                                          | FLOAT(40,20) | Publisher cost,\
        \ in the currency of the profile<br>Example: `13.12`                     \
        \                                                                        \
        \                                  |\n| `Device`                | Tracking\
        \ Raw Data - Click Tracking Data                                         \
        \                                          | TEXT(100)    | Device used by\
        \ the user who clicked the ad<br>Example: `iPhone 11`                    \
        \                                                                        \
        \                                   |\n| `Status`                | Tracking\
        \ Raw Data - Keywords Daily Performance                                  \
        \                                          | TEXT(50)     | Status of the\
        \ keyword<br>Valid values: `Active`, `Paused`, `Deleted`, `Pending`, `Inactive`,\
        \ `Disapproved`, `Approved`, `Failed`, `To Pause`, `To Delete`, `Failed to\
        \ Pause`, `Failed to Delete` |\n| `Quality_Score`         | Tracking Raw Data\
        \ - Keywords Daily Performance                                           \
        \                                 | INT          | Quality score of the keyword<br>Example:\
        \ `3`                                                                    \
        \                                                                        \
        \         |\n| `Impressions`           | Tracking Raw Data - Keywords Daily\
        \ Performance                                                            \
        \                | FLOAT(20,8)  | Impressions reported by the publisher<br>Example:\
        \ `14,519`                                                               \
        \                                                                        |\n\
        | `Clicks`                | Tracking Raw Data - Keywords Daily Performance\
        \                                                                        \
        \    | FLOAT(20,8)  | Clicks reported by the publisher<br>Example: `14`  \
        \                                                                        \
        \                                                                      |\n\
        | `Avg_Position`          | Tracking Raw Data - Keywords Daily Performance\
        \                                                                        \
        \    | FLOAT(40,20) | Average position of the impression<br>Example: `2.1`\
        \                                                                        \
        \                                                                     |\n\
        | `Avg_CPC`               | Tracking Raw Data - Keywords Daily Performance\
        \                                                                        \
        \    | FLOAT(40,20) | Average cost per click<br>Example: `0.64227`       \
        \                                                                        \
        \                                                                      |\n\
        | `Conversions`           | Tracking Raw Data - Keywords Daily Performance\
        \                                                                        \
        \    | FLOAT(40,20) | Conversion total. Contains all “aggregated to conv total”\
        \ conversion columns.<br>Example: `1200`                                 \
        \                                                                |\n| `CTR`\
        \                   | Tracking Raw Data - Keywords Daily Performance     \
        \                                                                       |\
        \ FLOAT(40,20) | Click-through rate<br>Example: `0.125`                  \
        \                                                                        \
        \                                                                 |\n| `Conv_Rate`\
        \             | Tracking Raw Data - Keywords Daily Performance           \
        \                                                                 | FLOAT(40,20)\
        \ | Average number of conversions per click<br>Example: `0.4`            \
        \                                                                        \
        \                                                    |\n| `Cost_per_Conv`\
        \         | Tracking Raw Data - Keywords Daily Performance               \
        \                                                             | FLOAT(40,20)\
        \ | Cost per conversion<br>Example: `1.54`                               \
        \                                                                        \
        \                                                    |\n| `Rev_per_Conv` \
        \         | Tracking Raw Data - Keywords Daily Performance               \
        \                                                             | FLOAT(40,20)\
        \ | Revenue per conversion<br>Example: `52.51`                           \
        \                                                                        \
        \                                                    |\n| `ROI`          \
        \         | Tracking Raw Data - Keywords Daily Performance               \
        \                                                             | FLOAT(40,20)\
        \ | Return on investment<br>Example: `11.25`                             \
        \                                                                        \
        \                                                    |\n| `Profit`       \
        \         | Tracking Raw Data - Keywords Daily Performance               \
        \                                                             | FLOAT(40,20)\
        \ | Revenue minus cost<br>Example: `27511`                               \
        \                                                                        \
        \                                                    |\n"
