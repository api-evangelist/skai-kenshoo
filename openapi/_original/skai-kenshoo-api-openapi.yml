        \ Groups<br>Fusion: Sitelinks<br>Fusion: Audiences<br>Fusion: Audiences by\
        \ Device  | FLOAT(40,20) | Return on investment<br>Example: `11.25`      \
        \                                                                        \
        \                                                                        \
        \                          |\n| `Rev./Conv.`                      | Fusion:\
        \ Profiles<br>Fusion: Campaigns<br>Fusion: Channels<br>Fusion: Campaigns by\
        \ Device<br>Fusion: Adgroups<br>Fusion: Ads<br>Fusion: Ads by Device<br>Fusion:\
        \ Keywords<br>Fusion: Keywords by Device<br>Fusion: Keywords with Content\
