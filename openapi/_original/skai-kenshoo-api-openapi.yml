        \ | Description |\n|---|---|---|---|\n| `AverageCPC` | Avg. CPC | MONETARY\
        \ | The average cost per click expressed as the number of clicks divided by\
        \ cost. |\n| `CTR` | CTR | PERCENT | The click-through rate, expressed as\
        \ the number of clicks on the ad divided by the times it was shown. |\n| `Clicks`\
        \ | Clicks | INTEGER | The number of clicks reported by the publisher. |\n\
        | `Conversion` | Conv. | FLOAT | An aggregation of all conversion actions\
        \ coming from publishers, Skai pixel, and 3rd-party integration, or from actions\
        \ you select. |\n| `ConversionRate` | Conv. Rate | PERCENT | The conversion\
        \ rate, expressed as the number of conversions divided by the number of clicks.\
        \ |\n| `Cost` | Cost | MONETARY | The publisher cost, in the currency of the\
        \ Skai profile. |\n| `CostConversion` | Cost/Conv. | MONETARY | The cost of\
        \ each conversion, expressed as cost divided by the number of conversions.\
        \ |\n| `Impressions` | Imp. | INTEGER | The number of impressions reported\
        \ by the publisher. |\n| `Profit` | Profit | MONETARY | Profit = revenue -\
        \ cost |\n| `ROI` | ROI | FLOAT | Return on investment. The formula is: ROI\
        \ = revenue / cost |\n| `Revenue` | Rev. | MONETARY | An aggregation of all\
        \ monetary value of conversion actions, coming from publishers, Skai's pixel,\
        \ and 3rd-party integration. |\n| `RevConversion` | Rev./Conv. | MONETARY\
        \ | The revenue amount divided by the number of conversions. |\n\n**Attributes**\
        \ (18 columns)\n\n| Column name | Display name | Type | Description |\n|---|---|---|---|\n\
        | `Additional images` | Additional images | STRING | Links to up to 20 additional\
        \ images of your item, separated by a comma (,), semicolon (;), space ( )\
        \ or vertical bar (|). |\n| `Additional images (cdn)` | Additional images\
        \ (CDN) | STRING | Additional image URLs of the product, hosted on CDN. |\n\
        | `Brand` | Brand | STRING | The brand of the product. |\n| `Buy box winner\
        \ (legacy)` | Buy box winner (legacy) | BOOLEAN | Indicates if you are the\
        \ Buy Box winner for a given product |\n| `Color` | Color | STRING | The color\
        \ of the product listing linked to the ad. |\n| `Inventory` | Inventory |\
        \ INTEGER | The current availability of the item. |\n| `Manufacturer` | Manufacturer\
        \ | STRING | The brand that manufactures the advertised product. |\n| `Marketplace`\
        \ | Marketplace | STRING | A geographical marketplace where products are sold.\
        \ |\n| `Material` | Material | STRING | The material the item is made from,\
        \ such as cotton, polyester, denim or leather. |\n| `Model` | Model | STRING\
        \ | The model of the product. |\n| `# Of Ads` | Number of ads | INTEGER |\
        \ The number of ads promoting this product |\n| `Availability` | Number of\
        \ sellers | INTEGER | The number of sellers selling this product. |\n| `Price`\
        \ | Price | MONETARY | The price of the product. |\n| `Product images` | Product\
        \ images | STRING | The URL for the main image of your product. |\n| `Publisher`\
        \ | Publisher | STRING | The name of the publisher serving the ads. |\n| `Shipped\
        \ by` | Shipped by | STRING | Indicates the vendor or seller shipping this\
        \ product. |\n| `Sold by` | Sold by | STRING | Indicates the vendor or seller\
        \ selling this product |\n| `Title` | Title | STRING | The name of the product\
        \ promoted in the campaign. |\n\n**Account-configured columns** *(vary by\
        \ account — call this endpoint authenticated to see yours)*\n\n| Column name\
        \ | Display name | Type | Description |\n|---|---|---|---|\n| `[Your Dimension\
        \ Name]` | *(your label)* | STRING | A custom tagging label you define in\
        \ Skai (e.g. \"Brand\", \"Region\", \"Campaign Theme\"). Applied to entities;\
        \ any value you've set appears here. |\n| `[Publisher / Pixel / 3rd-party\
        \ Conversion]` | *(event name)* | FLOAT | Each tracked conversion event appears\
        \ as two columns: a **count** column (number of conversions) and a **revenue**\
        \ column (monetary value). Names are set in Settings → Conversions. |\n| `[Your\
        \ Custom Metric]` | *(formula name)* | FLOAT | A formula-based column your\
        \ team defines (e.g. ROAS = Revenue / Cost). Available in the *Custom Metrics+*\
        \ and *Custom Metrics (legacy)* groups. |\n\n**Product Identifiers** (8 columns)\n\
        \n| Column name | Display name | Type | Description |\n|---|---|---|---|\n\
        | `Base & variants` | Base & variants | STRING | Base & variants |\n| `Ean`\
        \ | EAN | STRING | European Article Number. |\n| `GTIN` | GTIN | STRING |\
        \ Global Trade Item Number. |\n| `Mpn` | MPN | STRING | Manufacturer Part\
        \ Number. |\n| `Parent Product ID` | Parent Product ID | STRING | The product\
        \ ID of the parent product, if one exists. |\n| `Parent Product` | Parent\
        \ product | STRING | The product ID of the parent product, if one exists.\
        \ |\n| `Product Id` | Product ID | STRING | The unique identifier of the product\
        \ in the publisher. |\n| `Upc` | UPC | STRING | The Amazon UPC code. |\n#####\
        \ PRODUCT_TARGETING\n\n*Product targeting entities — keywords, ASINs, categories,\
        \ and product attributes used in retail media targeting.*\n\n> **Note:** Column\
        \ names for PRODUCT_TARGETING use display-name style (e.g. `Avg.CPC`, `Conv.`)\
        \ rather than camelCase. Use these exact strings in your API requests.\n\n\
        **Performance** (12 standard columns)\n\n| Column name | Display name | Type\
        \ | Description |\n|---|---|---|---|\n| `Avg.CPC` | Avg. CPC | MONETARY |\
        \ The average cost per click expressed as the number of clicks divided by\
        \ cost. |\n| `CTR` | CTR | PERCENT | The click-through rate, expressed as\
        \ the number of clicks on the ad divided by the times it was shown. |\n| `Clicks`\
        \ | Clicks | INTEGER | The number of clicks reported by the publisher. |\n\
        | `Conv.` | Conv. | FLOAT | An aggregation of all conversion actions coming\
        \ from publishers, Skai pixel, and 3rd-party integration, or from actions\
        \ you select. |\n| `Conv. Rate` | Conv. Rate | PERCENT | The conversion rate,\
        \ expressed as the number of conversions divided by the number of clicks.\
        \ |\n| `Cost` | Cost | MONETARY | The publisher cost, in the currency of the\
        \ Skai profile. |\n| `Cost/Conv.` | Cost/Conv. | MONETARY | The cost of each\
        \ conversion, expressed as cost divided by the number of conversions. |\n\
        | `Imp.` | Imp. | INTEGER | The number of impressions reported by the publisher.\
        \ |\n| `Profit` | Profit | MONETARY | Profit = revenue - cost |\n| `ROI` |\
        \ ROI | FLOAT | Return on investment. The formula is: ROI = revenue / cost\
        \ |\n| `Rev` | Rev. | MONETARY | An aggregation of all monetary value of conversion\
        \ actions, coming from publishers, Skai's pixel, and 3rd-party integration.\
        \ |\n| `Rev./Conv.` | Rev./Conv. | MONETARY | The revenue amount divided by\
        \ the number of conversions. |\n\n**Attributes** (30 columns)\n\n| Column\
        \ name | Display name | Type | Description |\n|---|---|---|---|\n| `Ad Group\
        \ Name` | Ad Group Name | STRING | The name of the ad group. |\n| `AdGroupId`\
        \ | Ad Group ID | INTEGER | The ad group ID in Skai. |\n| `AdGroupStatusToDisplay`\
        \ | Ad Group Status | STRING | The status of the ad group. |\n| `Bid` | Bid\
        \ | MONETARY | The entity bid amount in the currency defined for the Skai\
        \ profile. |\n| `Brand` | Brand | STRING | The brand of the product. |\n|\
        \ `Campaign ID` | Campaign ID | INTEGER | The campaign ID in Skai. |\n| `Campaign\
        \ Name` | Campaign Name | STRING | The campaign name in Skai. |\n| `CampaignStatusToDisplay`\
        \ | Campaign Status | STRING | The status of the campaign. |\n| `CampaignType`\
        \ | Campaign Goal | STRING | The type of campaign. |\n| `Category id` | Category\
        \ id | STRING | Category id |\n| `Channel` | Publisher | STRING | The name\
        \ of the publisher serving the ads. |\n| `Channel Target ID` | Channel Target\
        \ ID | STRING | The target ID in the publisher. |\n| `FailureReason` | Failure\
        \ Reason | STRING | The latest error recorded upon a failed attempt to sync\
        \ entity changes to the publisher. |\n| `Max. Price` | Max. Price | MONETARY\
        \ | Maximum price filter for product targeting. |\n| `Max. Rating` | Max.\
        \ Rating | FLOAT | Maximum customer rating filter for product targeting. |\n\
        | `Min. Price` | Min. Price | MONETARY | Minimum price filter for product\
        \ targeting. |\n| `Min. Rating` | Min. Rating | FLOAT | Minimum customer rating\
        \ filter for product targeting. |\n| `Modified` | Modified | BOOLEAN | Indicates\
        \ an edited entity. |\n| `Product Pages Bid Adj.` | Product Pages Bid Adj.\
        \ | FLOAT | A percentage increase or decrease in the bid for this placement.\
        \ |\n| `Profile Id` | Profile ID | INTEGER | The Skai profile ID. |\n| `Profile\
        \ Name` | Profile Name | STRING | The Skai profile name. |\n| `ProfileStatus`\
        \ | Profile Status | STRING | The Skai profile status. |\n| `Rest of Search\
        \ Bid Adj.` | Rest of Search Bid Adj. | FLOAT | A percentage increase or decrease\
        \ in the bid for placements outside top of search. |\n| `Shipping Eligibility`\
        \ | Shipping Eligibility | STRING | Shipping eligibility status for the targeted\
        \ product. |\n| `Target` | Target | STRING | The targeting expression (keyword,\
        \ ASIN, category, or product attribute). |\n| `Target ID` | Target ID | INTEGER\
        \ | The targeting ID in Skai. |\n| `Target Type` | Target Type | STRING |\
        \ The type of targeting (e.g. keyword, ASIN, category, product attribute).\
        \ |\n| `Targeting Status` | Targeting Status | STRING | The status of the\
        \ targeting entity. |\n| `Title` | Title | STRING | The name of the product\
        \ promoted in the campaign. |\n| `Top of Search Bid Adj.` | Top of Search\
        \ Bid Adj. | FLOAT | A percentage increase or decrease in the bid for top-of-search\
        \ placement. |\n\n**Account-configured columns** *(vary by account — call\
        \ this endpoint authenticated to see yours)*\n\n| Column name | Display name\
        \ | Type | Description |\n|---|---|---|---|\n| `[Your Dimension Name]` | *(your\
        \ label)* | STRING | A custom tagging label you define in Skai (e.g. \"Brand\"\
        , \"Region\", \"Campaign Theme\"). Applied to entities; any value you've set\
        \ appears here. |\n| `[Publisher / Pixel / 3rd-party Conversion]` | *(event\
        \ name)* | FLOAT | Each tracked conversion event appears as two columns: a\
        \ **count** column (number of conversions) and a **revenue** column (monetary\
        \ value). Names are set in Settings → Conversions. |\n| `[Your Custom Metric]`\
        \ | *(formula name)* | FLOAT | A formula-based column your team defines (e.g.\
        \ ROAS = Revenue / Cost). Available in the *Custom Metrics+* and *Custom Metrics\
        \ (legacy)* groups. |\n\n\n---\nReady to query? Use these column names in\
        \ [Synchronous Reports](#operation/fetchReport) or [Async Analysis Reports](#operation/asyncAnalysisReport)."
      operationId: "getAvailableColumns"
      parameters:
      - name: "entity"
        in: "path"
        description: "Important: For product grids use entity=PRODUCT_ASSET. For product\
          \ targeting use entity=PRODUCT_TARGETING."
        required: true
        style: "simple"
        explode: false
        schema:
          type: "string"
          enum:
          - "CAMPAIGN"
          - "ADGROUP"
          - "KEYWORD"
          - "AD"
          - "PORTFOLIO"
          - "PRODUCT_ASSET"
          - "PRODUCT_TARGETING"
      - $ref: "#/components/parameters/ks"
      - name: "profile_id"
        in: "query"
        description: "For _Cross-Profile_ columns, use `profile_id=0`. \nFor _Single-Profile_\
          \ columns, use the id of a single profile, like `profile_id=412`.\n"
        required: true
        style: "form"
        explode: true
        example: 412
      responses:
        200:
          description: "The operation was completed successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportColumnsResponse"
        400:
          $ref: "#/components/responses/BadRequest"
        500:
          $ref: "#/components/responses/InternalServerError"
