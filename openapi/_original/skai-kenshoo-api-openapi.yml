        \ | Total revenue, in the currency of the profile, contains revenue from all\
        \ “aggregated to conv total” conversion columns<br>Example: `23.34`      \
        \                                                                        |\n\
        | `ROI`                             | Fusion: Profiles<br>Fusion: Campaigns<br>Fusion:\
        \ Channels<br>Fusion: Campaigns by Device<br>Fusion: Adgroups<br>Fusion: Ads<br>Fusion:\
        \ Ads by Device<br>Fusion: Keywords<br>Fusion: Keywords by Device<br>Fusion:\
