          - "true"
          - "false"
          default: "true"
        day_parting_thursday:
          type: "string"
          description: "Defines whether campaigns included in the portfolio are active\
            \ or paused on Thursdays"
          enum:
          - "true"
          - "false"
          default: "true"
        day_parting_friday:
          type: "string"
          description: "Defines whether campaigns included in the portfolio are active\
            \ or paused on Fridays"
          enum:
          - "true"
          - "false"
          default: "true"
        day_parting_saturday:
          type: "string"
          description: "Defines whether campaigns included in the portfolio are active\
