    ReportRequest:
      required:
      - "date_range"
      - "entity"
      - "fields"
      type: "object"
      properties:
        entity:
          $ref: "#/components/schemas/ReportEntity"
        date_range:
          $ref: "#/components/schemas/DateRange"
        fields:
          uniqueItems: true
          type: "array"
          description: "The columns to be fetched. See [here](#operation/getAvailableColumns)\
            \ for available columns.\nTo get data segmented by date, add a date column,\
            \ like so: `{\"name\": \"Day\", \"group\": \"TimeSegment\"}`"
          items:
            $ref: "#/components/schemas/Column"
        filters:
          uniqueItems: true
          type: "array"
          items:
            $ref: "#/components/schemas/ReportFilter"
        sort:
          $ref: "#/components/schemas/ReportSort"
        info_level:
          type: "string"
          description: "Show summary records only, breakdown records only, or both."
          enum:
          - "SUMMARY"
          - "BREAKDOWN"
          - "BOTH"
          default: "BOTH"
        breakdown_type:
          type: "string"
          description: "To get data segmented only by date, use `GROUP`. To segment\
            \ by both date and another column, use `SEGMENT` with only the date column\
            \ in group_bys and include the other column in `fields` (these columns\
            \ will be fetched). Otherwise, use `FLAT`"
          enum:
          - "FLAT"
          - "GROUP"
          - "SEGMENT"
          default: "FLAT"
        group_bys:
          type: "Array"
          description: "When the breakdown type is \"SEGMENT\", select columns by\
            \ which to group the data."
        profile_token:
          type: "string"
          description: "Profile token. This is needed to access [Single-Profile columns](#operation/getAvailableColumns)\
            \ (alternative to profile_id)."
        profile_id:
          type: "number"
          description: "Profile ID. This is needed to access [Single-Profile columns](#operation/getAvailableColumns)\
            \ (alternative to profile_token)."
        limit:
          maximum: 1000
          type: "integer"
          description: "Set a limit for the retrieved records"
          format: "int32"
          default: 1000
        page:
          type: "integer"
          description: "The number of the report page you want to retrieve. You can\
            \ use this together with the Limit parameter to define the number of records\
            \ per page. The first page number is 0."
          format: "int32"
          default: 0
      description: "The properties for the report request"
      example:
        entity: "CAMPAIGN"
        profile_id: 118
        date_range:
          start_date: "2026-01-01"
          end_date: "2026-01-14"
        fields:
        - name: "CampaignName"
          group: "ATTRIBUTES"
        - name: "Clicks"
          group: "PERFORMANCE"
        filters:
        - field: "StatusToDisplay"
          group: "ATTRIBUTES"
          operator: "In"
          values:
          - "Approved"
          - "Active"
        - field: "CampaignName"
          group: "ATTRIBUTES"
          operator: "CONTAINS"
          values:
          - "My"
        - field: "Impressions"
          group: "PERFORMANCE"
          operator: "GREATER_THAN"
          values:
          - "0"
        breakdown_type: "GROUP"
        sort:
          field: "CampaignName"
          group: "ATTRIBUTES"
          order: "DESCENDING"
        limit: 1000
        page: 0
