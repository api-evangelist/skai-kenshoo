paths:
  /api/v1/reports:
    options:
      description: for cross origin requests
      parameters:
      - $ref: '#/components/parameters/ks'
      responses:
        200:
          description: successful operation
      tags:
      - Reports
components:
  parameters:
    ks:
      name: ks
      in: query
      description: The KS to refer the request to. You can find this ID in the Skai platform under _Administration_ -> _About Skai_ -> _Server ID_
      required: true
      style: form
      explode: true
      schema:
        type: string
      example: '1234'
