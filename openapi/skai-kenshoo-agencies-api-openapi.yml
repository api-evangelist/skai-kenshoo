      - Agencies
      operationId: optionsApiV1AgenciesByAgencyIdMonitoringTestsByTestIdAlgoTypesByAlgoTypeDatasourcesByDatasourceIdMonitoringData
      x-operation-id-source: derived
  /api/v1/agencies/{agency_id}/monitoring/tests/statuses:
    get:
      summary: Get all test statuses per agency id
      operationId: getTestStatuses
      parameters:
      - name: agency_id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int32
      responses:
        200:
          description: 200 response
        300:
          description: 300 response
      tags:
      - Agencies
    options:
      summary: Get all test statuses options
      responses:
        200:
          description: 200 response
        300:
          description: 300 response
      tags:
      - Agencies
      operationId: optionsApiV1AgenciesByAgencyIdMonitoringTestsStatuses
      x-operation-id-source: derived
  /api/v1/agencies/{agency_id}/monitoring/tests/{test_id}:
    get:
      summary: get test status
      operationId: getTestStatusById
      parameters:
      - name: agency_id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int32
      - name: test_id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int32
      responses:
        200:
          description: 200 response
        300:
          description: 300 response
      tags:
      - Agencies
    options:
      summary: get test status options
      responses:
        200:
          description: 200 response
        300:
          description: 300 response
      tags:
      - Agencies
      operationId: optionsApiV1AgenciesByAgencyIdMonitoringTestsByTestId
      x-operation-id-source: derived
  /api/v1/agencies/{agency_id}/monitoring/tests/{test_id}/data:
    get:
      summary: export monitoring data
      operationId: exportTestMonitoringData
      parameters:
      - name: agency_id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int32
      - name: test_id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int32
      responses:
        200:
          description: 200 response
        300:
          description: 300 response
      tags:
      - Agencies
    options:
      summary: export monitoring data options
      responses:
        200:
          description: 200 response
        300:
          description: 300 response
      tags:
      - Agencies
      operationId: optionsApiV1AgenciesByAgencyIdMonitoringTestsByTestIdData
      x-operation-id-source: derived
