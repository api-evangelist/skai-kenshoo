      summary: get available categories for line item
      operationId: getAmazonDspProductCategories
      responses:
        200:
          description: 200 response
        404:
          description: 404 response
        500:
          description: 500 response
      tags:
      - Entities Creator
    options:
      summary: get available categories for line item
      responses:
        200:
          description: 200 response
      tags:
      - Entities Creator
      operationId: optionsApiV1EntitiesCreatorLineItemDspProductCategories
      x-operation-id-source: derived
  /api/v1/entities-creator/inventory:
    post:
      summary: Get AmazonDSP inventories
      operationId: createInventory
      responses:
        201:
          description: 201 response
        500:
