openapi: 3.2.0
info:
  title: Skai Entities Creator API
  description: '# Overview

    Skai APIs provide programmatic access to advertising data and campaign management across Search, Social, and Retail Media publishers.'
  version: 1.0.0
  x-logo:
    url: https://grid.kenshoo.com/resources-frontend/latest/kenshoo_logo/skai-logo-devportal.svg
    backgroundColor: '#FFFFFF'
    altText: Skai
servers:
- url: https://services.kenshoo.com
security:
- BearerAuth: []
tags:
- name: Entities Creator
paths:
  /api/v1/entities-creator/itemsets:
    post:
      summary: Create new item sets
      operationId: createItems
      responses:
        201:
          description: New item sets were created successfully
        400:
          description: Request isn't valid
        404:
          description: Items weren't added
        500:
          description: Failed to create new items
      tags:
      - Entities Creator
    options:
      summary: Create item sets options
      responses:
        200:
          description: 200 response
      tags:
      - Entities Creator
      operationId: optionsApiV1EntitiesCreatorItemsets
      x-operation-id-source: derived
  /api/v1/entities-creator/order/dsp:
    put:
      summary: Edit AmazonDSP Campaign
      operationId: bulkUpdateCampaignAmazonDsp
      responses:
        201:
          description: 201 response
        500:
          description: 500 response
        207:
          description: 207 response
      tags:
      - Entities Creator
    post:
      summary: Create AmazonDSP Campaign
      operationId: bulkCreateCampaignAmazonDsp
      responses:
        201:
          description: 201 response
        500:
          description: 500 response
        207:
          description: 207 response
      tags:
