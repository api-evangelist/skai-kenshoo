      responses:
        200:
          description: 200 response
      tags:
      - Entities Creator
      operationId: optionsApiV1EntitiesCreatorOrderDsp
      x-operation-id-source: derived
  /api/v1/entities-creator/order/dsp/{orderId}:
    put:
      summary: Edit AmazonDSP Campaign
      operationId: updateCampaignAmazonDsp
      parameters:
      - name: orderId
        in: path
        required: true
        style: simple
        explode: false
      responses:
        201:
          description: 201 response
        500:
          description: 500 response
        207:
          description: 207 response
      tags:
      - Entities Creator
    post:
      summary: Get AmazonDSP Campaign
      operationId: createCampaignAmazonDsp
      parameters:
      - name: orderId
        in: path
        required: true
        style: simple
        explode: false
      responses:
        200:
          description: 200 response
      tags:
      - Entities Creator
    options:
      summary: Get AmazonDSP Campaign
      responses:
        200:
          description: 200 response
      tags:
      - Entities Creator
      operationId: optionsApiV1EntitiesCreatorOrderDspByOrderId
      x-operation-id-source: derived
  /api/v1/entities-creator/line-item/{lineItemId}:
